<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;background:#5bc0eb;touch-action:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
.overlay{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;align-items:center;justify-content:center;background:rgba(20,40,70,.45);z-index:10;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.hidden{display:none!important}
.card{background:#fffdf7;border-radius:26px;padding:24px 22px 18px;width:min(88vw,390px);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.35);color:#333;box-sizing:border-box;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
h1{margin:2px 0 4px;font-size:36px;letter-spacing:2px;background:linear-gradient(90deg,#ff5f8f,#ffa53b,#2fcf86,#4aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.sub{color:#888;font-size:14px;margin-bottom:12px}
.rules{text-align:left;padding:0 0 0 18px;margin:0 0 12px;font-size:13.5px;line-height:1.75;color:#444}
.rules b{color:#ff5f8f}
.tag{display:inline-block;width:19px;height:19px;line-height:19px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;text-align:center;margin:0 2px 0 4px;vertical-align:1px}
.ctrl{background:#eef7ff;border-radius:14px;padding:10px 12px;font-size:13px;color:#456;line-height:1.6;margin-bottom:14px;text-align:left}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:14px 0;font-size:20px;font-weight:800;color:#fff;letter-spacing:4px;background:linear-gradient(135deg,#ff6b9a,#ff9a4a);box-shadow:0 6px 0 #d9486f;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9486f}
.best{font-size:12px;color:#999;margin-top:10px}
.big{font-size:30px;font-weight:900;margin:4px 0 6px;color:#ff5f8f}
.big.win{color:#f5a300}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.stats div{background:#f2f7ff;border-radius:14px;padding:10px 0}
.stats b{display:block;font-size:23px;color:#333}
.stats span{font-size:12px;color:#888}
#boost{position:fixed;right:calc(24px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:108px;height:108px;border-radius:50%;z-index:5;touch-action:none;display:flex;align-items:center;justify-content:center;background:conic-gradient(#fff 360deg,rgba(255,255,255,.25) 0)}
#boost .in{width:94px;height:94px;border-radius:50%;background:rgba(255,107,154,.9);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(180,40,90,.8);letter-spacing:1px;pointer-events:none}
#boost.on .in{background:rgba(255,166,0,.95);transform:scale(.93) translateY(3px);box-shadow:0 2px 0 rgba(180,110,0,.8)}
#boost.low .in{background:rgba(160,160,180,.85);box-shadow:0 5px 0 rgba(90,90,110,.8)}
#jump{position:fixed;right:calc(24px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:20px;padding:14px 22px;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3ecf8e,#2ab7ff);box-shadow:0 5px 0 #1d8f9e;font-family:inherit;letter-spacing:2px}
#jump:active{transform:translateY(3px);box-shadow:0 2px 0 #1d8f9e}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#rotate{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#4aa8ff,#2c3466);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#rotate .ph{width:70px;height:116px;border:5px solid #fff;border-radius:16px;position:relative;animation:rot 2.2s ease-in-out infinite;margin-bottom:34px;box-sizing:border-box}

@keyframes rot{0%,15%{transform:rotate(0)}45%,70%{transform:rotate(-90deg)}100%{transform:rotate(0)}}

  #start h1{grid-area:t;font-size:32px;margin:0}
  #start .sub{grid-area:s;margin-bottom:8px}

  .stats{grid-template-columns:repeat(4,1fr);margin:12px 0 14px}

}

<body>
<canvas id="c"></canvas>
<div id="boost" class="hidden"><div class="in">冲刺</div></div>
<button id="jump" class="hidden">就这里，跳！</button>
<div id="safe"></div>
<div id="rotate" class="hidden"><div class="ph"></div><div class="t1">请把手机横过来玩</div><div class="t2">横屏视野更大，左手摇杆、右手冲刺<br>（记得关闭手机的竖屏锁定）</div><div class="t3" id="pauseTip"></div></div>

<div id="start" class="overlay"><div class="card">
  <h1>圈地大乱斗</h1>
  <div class="sub">跳伞 · 圈地 · 吃鸡 &nbsp;|&nbsp; 16 人一局约 2 分半</div>
  <ul class="rules">
    <li><b>跳伞</b>：点地图选落点，P城、军事基地、学校物资多</li>
    <li><b>圈地</b>：走出自己的地盘会拖出尾巴，绕一圈回家，圈住的地全归你</li>
    <li><b>淘汰</b>：碰到别人的尾巴就能淘汰他；撞上自己的尾巴会出局</li>
    <li><b>安全区</b>会缩小，圈外的领地会消失；活到最后或决赛圈领地最大就吃鸡</li>
    <li><b>道具</b>：<span class="tag" style="background:#ffa600">鞋</span>加速<span class="tag" style="background:#2ab7ff">盾</span>免死一次<span class="tag" style="background:#ff4d6d">炸</span>炸出一片地<span class="tag" style="background:#9b6bff">隐</span>尾巴隐身</li>
  </ul>
  <div class="ctrl" id="ctrlTip"></div>
  <button class="btn" id="startBtn">开始游戏</button>
  <div class="best" id="best1"></div>
</div></div>

<div id="end" class="overlay hidden"><div class="card">
  <div class="big" id="endTitle"></div>
  <div class="sub" id="endSub"></div>
  <div class="stats">
    <div><b id="sRank"></b><span>排名</span></div>
    <div><b id="sKills"></b><span>击杀</span></div>
    <div><b id="sPct"></b><span>最大领地</span></div>
    <div><b id="sTime"></b><span>存活时间</span></div>
  </div>
  <button class="btn" id="againBtn">再来一局</button>
  <div class="best" id="best2"></div>
</div></div>
<script>
(()=>{
'use strict';
const AUTO=/[?&]auto=1/.test(location.search);
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const TOUCH=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
const SAFE={l:0,r:0,t:0,b:0};let PORTRAIT=false;
let state='menu';
const input={ang:0,keyBoost:false,mouseBoost:false,btnBoost:false,joy:null,keys:{},mouseAim:false,mx:0,my:0};
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const cs=getComputedStyle($('safe'));SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;
  PORTRAIT=TOUCH&&H>W;$('rotate').classList.toggle('hidden',!PORTRAIT);
  $('pauseTip').textContent=(PORTRAIT&&state==='game')?'⏸ 游戏已暂停，横过来继续':'';
  if(PORTRAIT){input.joy=null;input.btnBoost=false;}
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();

// ---------- 配置 ----------
const WORLD=2400,CELL=8,GW=300,GH=300,N=GW*GH,WATER=255,ROCK=254,BOTS=15,MAXP=BOTS+1;
const R=13,BASE_SPEED=132,DROP_T=6,PARA_T=1.4,OUT_LIMIT=3,TAU=Math.PI*2,JOY_R=58,CX=WORLD/2,CY=WORLD/2;
const NAMES=['豆豆','小橘','阿呆','团子','大白','咕咕','皮蛋','奶糖','花卷','布丁','小丸子','土豆','可乐','年糕','麻薯','饭团','芝麻','果冻','跳跳','啾啾','汤圆','米粒','小鱼干','棉花糖'];
const COLORS=['#ffc23c','#ff6b9a','#3ecf8e','#4aa8ff','#a77bff','#ff7a45','#2ed3d3','#f25c54','#8cc63f','#5c7cfa','#e86fd0','#26c6a6','#ff9f43','#45aaf2','#b197fc','#e17055'];
function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16,n>>8&255,n&255];}
function mix(c,t,to){return c.map((v,i)=>Math.round(v+(to[i]-v)*t));}
function css(a){return 'rgb('+a[0]+','+a[1]+','+a[2]+')';}
const PAL=COLORS.map(h=>{const c=hexRgb(h);return {main:h,terr:mix(c,0.3,[255,255,255]),side:mix(c,0.32,[0,0,0]),dark:css(mix(c,0.42,[0,0,0])),light:css(mix(c,0.55,[255,255,255])),trail:css(mix(c,0.12,[255,255,255]))};});
const ITEMS={
  speed:{c:'#ffa600',ch:'鞋',name:'加速鞋',dur:6},
  shield:{c:'#2ab7ff',ch:'盾',name:'护盾',dur:20},
  bomb:{c:'#ff4d6d',ch:'炸',name:'炸弹',dur:0},
  cloak:{c:'#9b6bff',ch:'隐',name:'隐身斗篷',dur:6}};
const ITEM_KEYS=Object.keys(ITEMS),PW_KEYS=['speed','shield','cloak'];
// [等待秒, 缩圈秒, 目标半径(岛半径比例)]
const ZSTAGES=[[20,20,0.66],[12,18,0.43],[10,16,0.26],[8,14,0.12],[6,10,0]];
const HOT_NAMES=['P城','军事基地','学校'];

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function cellAt(x,y){const cx=(x/CELL)|0,cy=(y/CELL)|0;if(x<0||y<0||cx>=GW||cy>=GH)return -1;return cy*GW+cx;}
function cellXY(c){return {x:(c%GW+0.5)*CELL,y:(((c/GW)|0)+0.5)*CELL};}

// ---------- 网格与画布 ----------
const grid=new Uint8Array(N),trailG=new Uint8Array(N),vis=new Uint32Array(N),Q=new Int32Array(N);
let epoch=0;const cnt=new Int32Array(MAXP+1);let landCells=1;
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const terrC=mkCanvas(GW,GH),tctx=terrC.getContext('2d'),terrImg=tctx.createImageData(GW,GH);
const sideC=mkCanvas(GW,GH),sctx=sideC.getContext('2d'),sideImg=sctx.createImageData(GW,GH);
const ISL_S=0.5,islC=mkCanvas(WORLD*ISL_S,WORLD*ISL_S),ictx=islC.getContext('2d');
let dirty={x0:GW,y0:GH,x1:-1,y1:-1};
let G=null;
const cam={x:CX,y:CY,z:0.2,shake:0,sx:0,sy:0};

function paint(c){
  const id=grid[c],i=c*4,D=terrImg.data,S=sideImg.data;
  if(id>=1&&id<=MAXP){const P=PAL[G.players[id-1].pi];D[i]=P.terr[0];D[i+1]=P.terr[1];D[i+2]=P.terr[2];D[i+3]=255;S[i]=P.side[0];S[i+1]=P.side[1];S[i+2]=P.side[2];S[i+3]=255;}
  else{D[i+3]=0;S[i+3]=0;}
  const x=c%GW,y=(c/GW)|0;if(x<dirty.x0)dirty.x0=x;if(x>dirty.x1)dirty.x1=x;if(y<dirty.y0)dirty.y0=y;if(y>dirty.y1)dirty.y1=y;
}
function flush(){
  if(dirty.x1<0)return;
  const w=dirty.x1-dirty.x0+1,h=dirty.y1-dirty.y0+1;
  tctx.putImageData(terrImg,0,0,dirty.x0,dirty.y0,w,h);sctx.putImageData(sideImg,0,0,dirty.x0,dirty.y0,w,h);
  dirty={x0:GW,y0:GH,x1:-1,y1:-1};
}
function setOwner(c,id,defer){
  const old=grid[c];if(old===id)return false;
  if(old>=1&&old<=MAXP)cnt[old]--;
  grid[c]=id;
  if(id>=1&&id<=MAXP){cnt[id]++;const b=G.players[id-1].bb,x=c%GW,y=(c/GW)|0;if(x<b.x0)b.x0=x;if(x>b.x1)b.x1=x;if(y<b.y0)b.y0=y;if(y>b.y1)b.y1=y;}
  if(!defer)paint(c);
  return true;
}

// ---------- 岛屿 ----------
function genIsland(){
  const ph=[rand(0,TAU),rand(0,TAU),rand(0,TAU),rand(0,TAU)],amp=[rand(0.08,0.13),rand(0.05,0.08),rand(0.03,0.05),rand(0.015,0.03)];
  const IR=a=>Math.min(1150,960*(1+amp[0]*Math.sin(3*a+ph[0])+amp[1]*Math.sin(5*a+ph[1])+amp[2]*Math.sin(8*a+ph[2])+amp[3]*Math.sin(13*a+ph[3])));
  G.IR=IR;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const px=(x+0.5)*CELL-CX,py=(y+0.5)*CELL-CY;grid[y*GW+x]=Math.hypot(px,py)<IR(Math.atan2(py,px))?0:WATER;}
  // 物资点
  const a0=rand(0,TAU);G.hot=[];
  for(let i=0;i<3;i++){const a=a0+i*TAU/3+rand(-0.3,0.3),d=IR(a)*rand(0.45,0.58);G.hot.push({x:CX+Math.cos(a)*d,y:CY+Math.sin(a)*d,r:170,name:HOT_NAMES[i]});}
  // 石头
  G.rocks=[];
  for(let k=0,tries=0;k<8&&tries<200;tries++){
    const a=rand(0,TAU),d=IR(a)*rand(0.15,0.8),x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d;
    if(G.hot.some(h=>Math.hypot(h.x-x,h.y-y)<h.r+60)||Math.hypot(x-CX,y-CY)<80)continue;
    const rr=rand(14,30);G.rocks.push({x,y,r:rr});k++;
    for(let cy=((y-rr)/CELL)|0;cy<=((y+rr)/CELL)|0;cy++)for(let cx=((x-rr)/CELL)|0;cx<=((x+rr)/CELL)|0;cx++){const c=cy*GW+cx;if(grid[c]===0&&Math.hypot((cx+0.5)*CELL-x,(cy+0.5)*CELL-y)<rr)grid[c]=ROCK;}
  }
  landCells=0;for(let i=0;i<N;i++)if(grid[i]===0)landCells++;
  // 绘制岛屿底图
  const g=ictx;g.setTransform(ISL_S,0,0,ISL_S,0,0);g.clearRect(0,0,WORLD,WORLD);
  const poly=(off)=>{g.beginPath();for(let i=0;i<=240;i++){const a=i/240*TAU,r=IR(a)+off;const x=CX+Math.cos(a)*r,y=CY+Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();};
  poly(46);g.fillStyle='rgba(255,255,255,0.22)';g.fill();
  poly(22);g.fillStyle='#ffe3a3';g.fill();
  poly(0);g.fillStyle='#b5e8a0';g.fill();
  g.save();poly(0);g.clip();
  for(let i=0;i<900;i++){const a=rand(0,TAU),d=Math.sqrt(Math.random())*1150,x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d;g.fillStyle=Math.random()<0.8?'rgba(110,190,100,0.35)':(Math.random()<0.5?'#ffd6e7':'#ffffff');g.beginPath();g.arc(x,y,rand(3,7),0,TAU);g.fill();}
  for(const h of G.hot){
    g.fillStyle='rgba(230,205,150,0.75)';g.beginPath();g.arc(h.x,h.y,h.r,0,TAU);g.fill();
    for(let k=0;k<9;k++){const a=rand(0,TAU),d=rand(20,h.r-30),x=h.x+Math.cos(a)*d,y=h.y+Math.sin(a)*d,w=rand(26,40);
      g.fillStyle='rgba(0,0,0,0.12)';g.fillRect(x-w/2+4,y-w/2+6,w,w);g.fillStyle='#fff6e6';g.fillRect(x-w/2,y-w/2,w,w);
      g.fillStyle=['#ff8fab','#74c0fc','#ffb347','#9be7a1'][k%4];g.fillRect(x-w/2,y-w/2,w,w*0.38);}
  }
  for(let i=0;i<40;i++){const a=rand(0,TAU),d=Math.sqrt(Math.random())*900,x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d;if(G.hot.some(h=>Math.hypot(h.x-x,h.y-y)<h.r+20))continue;
    g.fillStyle='rgba(0,0,0,0.12)';g.beginPath();g.arc(x+4,y+6,16,0,TAU);g.fill();g.fillStyle='#6cc56a';g.beginPath();g.arc(x,y,16,0,TAU);g.fill();g.fillStyle='#8ad98a';g.beginPath();g.arc(x-5,y-5,8,0,TAU);g.fill();}
  g.restore();
  for(const r of G.rocks){g.fillStyle='rgba(0,0,0,0.15)';g.beginPath();g.arc(r.x+4,r.y+7,r.r+4,0,TAU);g.fill();g.fillStyle='#a3a9b8';g.beginPath();g.arc(r.x,r.y,r.r+3,0,TAU);g.fill();g.fillStyle='#c9ced9';g.beginPath();g.arc(r.x-r.r*0.3,r.y-r.r*0.3,r.r*0.45,0,TAU);g.fill();}
}
function isFreeLand(x,y){const c=cellAt(x,y);return c>=0&&grid[c]===0;}
function blockedAt(x,y){const c=cellAt(x,y);if(c<0)return true;const g=grid[c];return g===WATER||g===ROCK;}
function randLand(){for(let i=0;i<200;i++){const a=rand(0,TAU),d=Math.sqrt(Math.random())*1100,x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d;if(isFreeLand(x,y))return {x,y};}return {x:CX,y:CY};}
function snapLand(x,y){if(isFreeLand(x,y)&&Math.hypot(x-CX,y-CY)<G.IR(Math.atan2(y-CY,x-CX))-30)return {x,y};const a=Math.atan2(y-CY,x-CX);const r=Math.min(Math.hypot(x-CX,y-CY),G.IR(a)-40);for(let k=0;k<30;k++){const rr=r-k*20;const px=CX+Math.cos(a)*rr,py=CY+Math.sin(a)*rr;if(isFreeLand(px,py))return {x:px,y:py};}return randLand();}

// ---------- 安全区 ----------
function buildZone(){
  const st=[];let cx=CX,cy=CY,r=1260;const IRm=980;
  for(const [hold,shrink,f] of ZSTAGES){
    const nr=IRm*f;let nx=cx,ny=cy;
    for(let i=0;i<30;i++){const a=rand(0,TAU),d=Math.random()*(r-nr)*0.55;const px=cx+Math.cos(a)*d,py=cy+Math.sin(a)*d;if(Math.hypot(px-CX,py-CY)<G.IR(Math.atan2(py-CY,px-CX))-nr*0.4-40||nr===0&&isFreeLand(px,py)){nx=px;ny=py;break;}}
    st.push({hold,shrink,fx:cx,fy:cy,fr:r,tx:nx,ty:ny,tr:nr});cx=nx;cy=ny;r=nr;
  }
  G.zst=st;G.zoneEnd=st.reduce((s,a)=>s+a.hold+a.shrink,0);
  G.zone={x:CX,y:CY,r:1260,nx:st[0].tx,ny:st[0].ty,nr:st[0].tr,stage:0,phase:'hold',left:st[0].hold};
}
function zoneAt(t){
  const z=G.zone;let acc=0;
  for(let i=0;i<G.zst.length;i++){const s=G.zst[i];
    if(t<acc+s.hold){z.x=s.fx;z.y=s.fy;z.r=s.fr;z.nx=s.tx;z.ny=s.ty;z.nr=s.tr;z.stage=i;z.phase='hold';z.left=acc+s.hold-t;return;}
    acc+=s.hold;
    if(t<acc+s.shrink){const k=(t-acc)/s.shrink;z.x=s.fx+(s.tx-s.fx)*k;z.y=s.fy+(s.ty-s.fy)*k;z.r=s.fr+(s.tr-s.fr)*k;z.nx=s.tx;z.ny=s.ty;z.nr=s.tr;z.stage=i;z.phase='shrink';z.left=acc+s.shrink-t;return;}
    acc+=s.shrink;
  }
  const s=G.zst[G.zst.length-1];z.x=s.tx;z.y=s.ty;z.r=0;z.nr=0;z.stage=G.zst.length-1;z.phase='done';z.left=0;
}
const inZone=(x,y)=>{const z=G.zone;return Math.hypot(x-z.x,y-z.y)<=z.r;};
// ---------- 玩家 ----------
function makePlayer(i,name,isPlayer){
  return {id:i+1,pi:i,name,isPlayer,x:CX,y:CY,px:CX,py:CY,ang:rand(0,TAU),target:0,alive:true,cell:-1,trail:[],tcells:[],kills:0,maxPct:0,pct:0,outside:0,
    pw:{speed:0,shield:0,cloak:0},energy:1,boosting:false,boost:false,bb:{x0:GW,y0:GH,x1:-1,y1:-1},inv:0,land:null,bob:Math.random()*TAU,
    ai:{skill:isPlayer?0.9:rand(0.45,1),aggr:rand(0.15,0.75),greed:rand(0.25,1),mode:'home',wp:[],timer:rand(0,0.2),home:null,boostT:0,maxTrail:60,chase:null,crate:null,hotPref:Math.random()<0.55}};
}
function newGame(demo){
  grid.fill(0);trailG.fill(0);cnt.fill(0);
  G={demo:!!demo,phase:'drop',pt:0,t:0,players:[],crates:[],particles:[],rings:[],floats:[],wfloats:[],feed:[],reveals:[],over:false,result:null,crateTimer:0,sweep:0,aliveN:MAXP,jumpNow:false};
  genIsland();buildZone();
  const pa=rand(0,TAU),off=rand(-250,250);
  G.plane={ax:CX-Math.cos(pa)*1700-Math.sin(pa)*off,ay:CY-Math.sin(pa)*1700+Math.cos(pa)*off,bx:CX+Math.cos(pa)*1700-Math.sin(pa)*off,by:CY+Math.sin(pa)*1700+Math.cos(pa)*off,ang:pa};
  const pl=makePlayer(0,'你',true);G.player=pl;G.players.push(pl);
  const names=shuffle(NAMES.slice());
  for(let i=0;i<BOTS;i++)G.players.push(makePlayer(i+1,names[i],false));
  for(const p of G.players)if(!p.isPlayer)pickLand(p);
  for(let i=0;i<26;i++)spawnCrate(true);
  terrImg.data.fill(0);sideImg.data.fill(0);dirty={x0:0,y0:0,x1:GW-1,y1:GH-1};flush();
  if(demo){pl.land=randLandFar();startPara();landAll();}
}
function randLandFar(){for(let i=0;i<60;i++){const p=randLand();if(G.players.every(o=>!o.land||Math.hypot(o.land.x-p.x,o.land.y-p.y)>170))return p;}return randLand();}
function pickLand(p){
  for(let i=0;i<60;i++){
    let pt;
    if(p.ai.hotPref&&i<40){const h=G.hot[(Math.random()*3)|0];const a=rand(0,TAU),d=rand(0,h.r+60);pt={x:h.x+Math.cos(a)*d,y:h.y+Math.sin(a)*d};}
    else pt=randLand();
    if(!isFreeLand(pt.x,pt.y))continue;
    if(G.players.every(o=>o===p||!o.land||Math.hypot(o.land.x-pt.x,o.land.y-pt.y)>210)){p.land=pt;return;}
  }
  p.land=randLand();
}
function startPara(){
  const pl=G.player;
  if(!pl.land){const t=rand(0.35,0.65);const pp=snapLand(G.plane.ax+(G.plane.bx-G.plane.ax)*t,G.plane.ay+(G.plane.by-G.plane.ay)*t);pl.land=pp;}
  for(const p of G.players)if(!p.isPlayer&&Math.hypot(p.land.x-pl.land.x,p.land.y-pl.land.y)<130){p.land=null;pickLand(p);}
  G.phase='para';G.pt=0;$('jump').classList.add('hidden');
}
function landAll(){
  G.phase='play';G.t=0;
  for(const p of G.players){
    p.x=p.px=p.land.x;p.y=p.py=p.land.y;p.ang=Math.atan2(CY-p.y,CX-p.x)+rand(-1,1);p.target=p.ang;
    const c0=cellAt(p.x,p.y),cx0=c0%GW,cy0=(c0/GW)|0;
    for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){if(dx*dx+dy*dy>27)continue;const x=cx0+dx,y=cy0+dy;if(x<0||y<0||x>=GW||y>=GH)continue;const c=y*GW+x;if(grid[c]===WATER||grid[c]===ROCK)continue;setOwner(c,p.id);}
    p.cell=cellAt(p.x,p.y);
    if(grid[p.cell]!==p.id)setOwner(p.cell,p.id);
    G.rings.push({x:p.x,y:p.y,r:10,max:60,c:PAL[p.pi].main,life:0.6,t:0.6});
  }
  if(G.player)input.ang=G.player.ang;
  if(!G.demo&&TOUCH)$('boost').classList.remove('hidden');
}
function spawnCrate(initial){
  let pt=null;
  for(let i=0;i<30;i++){
    let x,y;
    if(Math.random()<0.6){const h=G.hot[(Math.random()*3)|0];const a=rand(0,TAU),d=Math.sqrt(Math.random())*(h.r+40);x=h.x+Math.cos(a)*d;y=h.y+Math.sin(a)*d;}
    else{const p=randLandAny();x=p.x;y=p.y;}
    if(blockedAt(x,y))continue;
    if(!initial&&!inZone(x,y))continue;
    if(G.crates.some(c=>Math.hypot(c.x-x,c.y-y)<40))continue;
    pt={x,y};break;
  }
  if(!pt)return;
  const r=Math.random();const type=r<0.3?'speed':r<0.55?'shield':r<0.8?'bomb':'cloak';
  G.crates.push({x:pt.x,y:pt.y,type,ph:Math.random()*TAU,born:G.t});
}
function randLandAny(){for(let i=0;i<100;i++){const a=rand(0,TAU),d=Math.sqrt(Math.random())*1100,x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d;if(!blockedAt(x,y))return {x,y};}return {x:CX,y:CY};}

// ---------- 特效 ----------
function burst(x,y,c,n,sp){sp=sp||1;for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(60,240)*sp;G.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(0.45,0.9),max:0.9,c,r:rand(2.5,6)});}}
function addFloat(text,color){G.floats.push({text,color,t:1.6});if(G.floats.length>3)G.floats.shift();}
function addFeed(text,me){G.feed.unshift({text,t:4.5,me});if(G.feed.length>5)G.feed.length=5;}
function shake(a){cam.shake=Math.max(cam.shake,a);}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
const isMe=p=>p&&p.isPlayer&&!G.demo;

// ---------- 规则 ----------
function clearTrail(p){for(const c of p.tcells)if(trailG[c]===p.id)trailG[c]=0;p.tcells=[];p.trail=[];}
function transferLand(p,to){
  const b=p.bb;if(b.x1<0)return;
  for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++){const c=y*GW+x;if(grid[c]===p.id)setOwner(c,to);}
}
function kill(p,killer,reason){
  if(!p.alive)return;
  p.alive=false;p.deathT=G.t;p.reason=reason;p.killer=killer;p.dmode=p.ai.mode;p.dtl=p.tcells.length;
  clearTrail(p);
  const heir=killer&&killer.alive&&killer!==p?killer:null;
  transferLand(p,heir?heir.id:0);
  burst(p.x,p.y,PAL[p.pi].main,28,1.2);G.rings.push({x:p.x,y:p.y,r:10,max:90,c:'#ffffff',life:0.5,t:0.5});
  if(heir){heir.kills++;}
  let txt;
  if(reason==='cut')txt=killer.name+' 切断了 '+p.name+' 的尾巴';
  else if(reason==='self')txt=p.name+' 撞上了自己的尾巴';
  else if(reason==='zone')txt=p.name+' 被毒圈淘汰';
  else if(reason==='absorb')txt=killer.name+' 吞并了 '+p.name;
  else if(reason==='headon')txt=killer.name+' 撞飞了 '+p.name;
  else txt=p.name+' 出局';
  addFeed(txt,isMe(p)||isMe(killer));
  if(isMe(killer)){addFloat('淘汰 '+p.name+'！','#ffd93d');shake(6);vib(40);}
  if(isMe(p)){p.rank=G.players.filter(x=>x.alive).length+1;shake(12);vib([60,40,120]);}
  else if(Math.hypot(p.x-cam.x,p.y-cam.y)<500)shake(3);
}
function hitTrail(victim,by,kind){
  if(!victim.alive)return;
  if(victim.pw.shield>0){
    victim.pw.shield=0;clearTrail(victim);victim.inv=1;
    burst(victim.x,victim.y,'#2ab7ff',18);
    if(isMe(victim))addFloat('护盾抵挡！尾巴被清除','#8fdcff');
    return;
  }
  kill(victim,kind==='self'?null:by,kind);
}
function enterCell(p,c){
  const tO=trailG[c];
  if(tO){
    if(tO===p.id){const t=p.tcells,n=t.length;if(n>=4&&t[n-1]!==c&&t[n-2]!==c&&t[n-3]!==c&&t[n-4]!==c){hitTrail(p,p,'self');if(!p.alive)return;}}
    else{const v=G.players[tO-1];if(v&&v.alive&&v!==p){hitTrail(v,p,'cut');}}
  }
  if(grid[c]===p.id){if(p.tcells.length)closeLoop(p);}
  else if(trailG[c]!==p.id){
    if(p.tcells.length===0)p.trail=[{x:p.px,y:p.py}];
    trailG[c]=p.id;p.tcells.push(c);
  }
}
function fillEnclosed(p,claimed){
  const b=p.bb,id=p.id;
  const x0=Math.max(0,b.x0-1),y0=Math.max(0,b.y0-1),x1=Math.min(GW-1,b.x1+1),y1=Math.min(GH-1,b.y1+1);
  epoch++;let qh=0,qt=0;
  const push=c=>{if(vis[c]!==epoch&&grid[c]!==id){vis[c]=epoch;Q[qt++]=c;}};
  for(let x=x0;x<=x1;x++){push(y0*GW+x);push(y1*GW+x);}
  for(let y=y0;y<=y1;y++){push(y*GW+x0);push(y*GW+x1);}
  while(qh<qt){const c=Q[qh++],x=c%GW,y=(c/GW)|0;if(x>x0)push(c-1);if(x<x1)push(c+1);if(y>y0)push(c-GW);if(y<y1)push(c+GW);}
  for(let y=y0+1;y<y1;y++)for(let x=x0+1;x<x1;x++){const c=y*GW+x,g=grid[c];if(vis[c]!==epoch&&g!==id&&g!==WATER&&g!==ROCK){setOwner(c,id,isMe(p));claimed.push(c);}}
}
function afterClaim(p,claimed,ox,oy){
  // 被吞光领地的人出局
  for(const o of G.players)if(o.alive&&o!==p&&cnt[o.id]<=0)kill(o,p,'absorb');
  if(!claimed.length)return;
  const me=isMe(p);
  if(me){
    claimed.sort((a,b)=>{const A=cellXY(a),B=cellXY(b);return Math.hypot(A.x-ox,A.y-oy)-Math.hypot(B.x-ox,B.y-oy);});
    G.reveals.push({cells:claimed,idx:0,start:G.t,dur:Math.min(0.5,0.18+claimed.length/4000)});
    const pct=claimed.length/landCells*100;
    G.wfloats.push({x:p.x,y:p.y-30,text:'+'+pct.toFixed(1)+'%',t:1.2,c:PAL[p.pi].main,big:pct>3});
    shake(clamp(claimed.length/250,2,9));vib(15);
  }
  if(me||Math.hypot(p.x-cam.x,p.y-cam.y)<700){
    G.rings.push({x:ox,y:oy,r:8,max:40+Math.sqrt(claimed.length)*4,c:PAL[p.pi].main,life:0.55,t:0.55});
    burst(ox,oy,PAL[p.pi].light,me?22:10,0.8);
  }
}
function closeLoop(p){
  const claimed=[];
  for(const c of p.tcells){if(trailG[c]===p.id)trailG[c]=0;if(setOwner(c,p.id,isMe(p)))claimed.push(c);}
  p.tcells=[];p.trail=[];
  fillEnclosed(p,claimed);
  afterClaim(p,claimed,p.x,p.y);
}
function bombClaim(p){
  const claimed=[],c0=cellAt(p.x,p.y),cx0=c0%GW,cy0=(c0/GW)|0,RR=10;
  for(let dy=-RR;dy<=RR;dy++)for(let dx=-RR;dx<=RR;dx++){if(dx*dx+dy*dy>RR*RR)continue;const x=cx0+dx,y=cy0+dy;if(x<0||y<0||x>=GW||y>=GH)continue;const c=y*GW+x,g=grid[c];if(g===WATER||g===ROCK)continue;
    if(trailG[c]&&trailG[c]!==p.id)continue;
    if(setOwner(c,p.id,isMe(p)))claimed.push(c);}
  burst(p.x,p.y,'#ff4d6d',30,1.4);G.rings.push({x:p.x,y:p.y,r:10,max:RR*CELL+10,c:'#ff4d6d',life:0.5,t:0.5});
  if(p.tcells.length){
    // 炸弹圈到了自己的尾巴 —— 若脚下已是自己的地就直接收口
    if(grid[p.cell]===p.id)closeLoop(p);
  }
  afterClaim(p,claimed,p.x,p.y);
  if(isMe(p)){addFloat('炸弹！炸出一片地','#ff8fa3');shake(8);}
}
function applyItem(p,type){
  const I=ITEMS[type];
  if(type==='bomb')bombClaim(p);else p.pw[type]=I.dur;
  if(isMe(p)&&type!=='bomb'){addFloat('获得【'+I.name+'】','#ffffff');vib(20);}
}
// ---------- AI ----------
function trailNear(p,c,rad){const cx=c%GW,cy=(c/GW)|0,id=p.id;for(let dy=-rad;dy<=rad;dy++){const y=cy+dy;if(y<0||y>=GH)continue;for(let dx=-rad;dx<=rad;dx++){const x=cx+dx;if(x<0||x>=GW)continue;const q=y*GW+x;if(trailG[q]===id&&!recentTrail(p,q))return true;}}return false;}
function lineClear(p,x,y){const dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy),n=Math.ceil(d/6);for(let i=2;i<=n;i++){const c=cellAt(p.x+dx*i/n,p.y+dy*i/n);if(c<0)return false;const g=grid[c];if(g===WATER||g===ROCK)return false;if(trailNear(p,c,1))return false;}return true;}
function nearestOwn(p,maxR){
  const cx=(p.x/CELL)|0,cy=(p.y/CELL)|0,id=p.id;let fallback=null,checked=0;
  for(let r=1;r<=maxR;r++){
    const found=[];
    for(let k=-r;k<=r;k++){
      const pts=[[cx+k,cy-r],[cx+k,cy+r],[cx-r,cy+k],[cx+r,cy+k]];
      for(const [x,y] of pts){if(x<0||y<0||x>=GW||y>=GH)continue;const c=y*GW+x;if(grid[c]===id&&!trailG[c]&&!trailNear(p,c,2))found.push(c);}
    }
    for(let i=0;i<found.length&&checked<40;i+=Math.max(1,(found.length/6)|0)){const q=cellXY(found[i]);checked++;if(!fallback)fallback=q;if(lineClear(p,q.x,q.y))return q;}
    if(checked>=40)break;
  }
  if(fallback)return fallback;
  const b=p.bb;return b.x1>=0?{x:(b.x0+b.x1+1)/2*CELL,y:(b.y0+b.y1+1)/2*CELL}:{x:G.zone.x,y:G.zone.y};
}
function recentTrail(p,c){const t=p.tcells,n=t.length;for(let i=Math.max(0,n-7);i<n;i++)if(t[i]===c)return true;return false;}
function botThink(p,alive){
  const ai=p.ai,z=G.zone,out=p.tcells.length>0,me=cnt[p.id];
  let tx=null,ty=null;
  // 最近的敌人
  let dE=1e9,eN=null;
  for(const o of alive){if(o===p)continue;const d=dist(o,p);if(d<dE){dE=d;eN=o;}}
  const zd=Math.hypot(p.x-z.x,p.y-z.y);
  const zoneDanger=z.r<=0?true:(zd>z.r-70||(z.phase==='shrink'&&zd>z.r-140));
  // 下一个圈的方向偏好
  const nextOut=z.nr>0&&Math.hypot(p.x-z.nx,p.y-z.ny)>z.nr*0.7;
  let home=null,homeD=0;
  if(out){home=nearestOwn(p,60);homeD=dist(p,home);}
  if(out){
    let threat=1e9;
    for(const o of alive){if(o===p||dist(o,p)>800)continue;for(let k=0;k<p.trail.length;k+=3){const d=dist(o,p.trail[k]);if(d<threat)threat=d;}const d2=dist(o,p);if(d2<threat)threat=d2;}
    const danger=threat<homeD*1.4+40+80*ai.skill||p.tcells.length>ai.maxTrail;
    if(zoneDanger){const hz=home&&Math.hypot(home.x-z.x,home.y-z.y)<z.r-20;if(hz){tx=home.x;ty=home.y;}else{tx=z.x;ty=z.y;}ai.mode='return';}
    else if(ai.mode==='chase'&&ai.chase&&ai.chase.alive&&ai.chase.trail.length&&ai.chase.pw.cloak<=0&&p.tcells.length<ai.maxTrail*0.7&&threat>60){
      let bp=null,bd=1e9;const tr=ai.chase.trail;for(let k=0;k<tr.length;k+=2){const d=dist(p,tr[k]);if(d<bd){bd=d;bp=tr[k];}}
      if(bp&&bd<320){tx=bp.x;ty=bp.y;if(bd<160&&p.energy>0.4)ai.boostT=0.3;}else ai.mode='return';
    }
    else if(ai.mode==='crate'&&ai.crate&&G.crates.includes(ai.crate)&&!danger){tx=ai.crate.x;ty=ai.crate.y;}
    else if(danger||ai.mode==='return'||!ai.wp.length){ai.mode='return';if(danger&&p.energy>0.5&&threat<90)ai.boostT=0.4;}
    else{while(ai.wp.length&&dist(p,ai.wp[0])<28)ai.wp.shift();if(ai.wp.length){tx=ai.wp[0].x;ty=ai.wp[0].y;}else ai.mode='return';}
    if(tx===null){tx=home.x;ty=home.y;}
  }else{
    ai.wp=[];ai.mode='home';
    // 寻找可以切的尾巴
    let bp=null,bd=110+170*ai.aggr,bo=null;
    for(const o of alive){if(o===p||!o.trail.length||o.pw.cloak>0)continue;const tr=o.trail;const w=o.isPlayer?1.25:1;for(let k=0;k<tr.length;k+=2){const d=dist(p,tr[k])/w;if(d<bd){bd=d;bp=tr[k];bo=o;}}}
    if(bp&&G.t>8&&Math.random()<0.05+ai.aggr*0.15&&inZone(bp.x,bp.y)){ai.mode='chase';ai.chase=bo;tx=bp.x;ty=bp.y;ai.maxTrail=40+60*ai.greed;}
    if(tx===null){
      let bc=null,bcd=300;
      for(const c of G.crates){const d=dist(p,c);if(d<bcd&&inZone(c.x,c.y)&&(!eN||dist(eN,c)>d*0.7)){bcd=d;bc=c;}}
      if(bc){ai.mode='crate';ai.crate=bc;tx=bc.x;ty=bc.y;ai.maxTrail=bcd/CELL*2.4+20;}
    }
    if(tx===null&&zoneDanger){tx=z.x;ty=z.y;}
    if(tx===null){
      // 规划一圈
      let dir;
      if(nextOut&&Math.random()<0.75)dir=Math.atan2(z.ny-p.y,z.nx-p.x)+rand(-0.5,0.5);
      else if(Math.random()<0.5)dir=Math.atan2(z.y-p.y,z.x-p.x)+rand(-1.4,1.4);
      else dir=rand(0,TAU);
      const danger=clamp(dE/420,0.3,1.15);
      const L=Math.max(55,(40+150*ai.greed)*danger*(0.7+Math.min(0.6,G.t/120)));
      const ca=Math.cos(dir),sa=Math.sin(dir);let ex=p.x,ey=p.y;
      for(let s=0;s<80;s++){const c=cellAt(ex,ey);if(c<0||grid[c]!==p.id)break;ex+=ca*8;ey+=sa*8;}
      const side=Math.random()<0.5?1:-1,px=-sa*side,py=ca*side,w=Math.max(45,L*rand(0.6,1));
      ai.wp=[{x:ex+ca*L,y:ey+sa*L},{x:ex+ca*L+px*w,y:ey+sa*L+py*w},{x:ex+px*w,y:ey+py*w}];
      ai.maxTrail=(L*2+w*2)/CELL*1.25+10;
      ai.mode='out';tx=ai.wp[0].x;ty=ai.wp[0].y;
    }
  }
  // 避障转向
  const desired=Math.atan2(ty-p.y,tx-p.x),look=(out?70:50)+40*ai.skill;
  const zoneCheck=!zoneDanger&&z.r>40;
  let bestA=desired,bestS=-1e9;
  const KN=out?7:5,KS=out?0.4:0.33;
  for(let k=-KN;k<=KN;k++){
    const a=desired+k*KS,ca=Math.cos(a),sa=Math.sin(a);let free=look;
    for(let t=10;t<=look;t+=10){
      const x=p.x+ca*t,y=p.y+sa*t,c=cellAt(x,y);let hit=false;
      if(c<0)hit=true;else{const g=grid[c];if(g===WATER||g===ROCK)hit=true;else if(out&&trailNear(p,c,1))hit=true;
        else if(zoneCheck&&!inZone(x,y)&&g!==p.id)hit=true;}
      if(!hit&&out)for(const o of alive){if(o===p||cnt[o.id]<me)continue;if(Math.abs(o.x-x)<30&&Math.abs(o.y-y)<30){hit=true;break;}}
      if(hit){free=t-10;break;}
    }
    const s=free-Math.abs(k*KS)*16*ai.skill;
    if(s>bestS){bestS=s;bestA=a;}
  }
  p.target=bestA+rand(-1,1)*(1-ai.skill)*0.2;
  if(bestS<look*0.5)ai.timer=Math.min(ai.timer,0.05);
}

// ---------- 更新 ----------
function movePlayer(p,dt){
  const turn=7.5;
  const d=angDiff(p.ang,p.target);p.ang+=clamp(d,-turn*dt,turn*dt);
  if(p.boost&&p.energy>0.04){p.boosting=true;p.energy=Math.max(0,p.energy-0.42*dt);}else{p.boosting=false;p.energy=Math.min(1,p.energy+0.15*dt);}
  let sp=BASE_SPEED*(p.pw.speed>0?1.45:1)*(p.boosting?1.5:1);
  let left=sp*dt;const ca=Math.cos(p.ang),sa=Math.sin(p.ang);
  p.moving=false;
  while(left>0&&p.alive){
    const st=Math.min(4,left);left-=st;
    let nx=p.x+ca*st,ny=p.y+sa*st;
    if(blockedAt(nx,ny)){if(!blockedAt(nx,p.y))ny=p.y;else if(!blockedAt(p.x,ny))nx=p.x;else break;}
    p.px=p.x;p.py=p.y;p.x=nx;p.y=ny;p.moving=true;
    const c=cellAt(p.x,p.y);
    if(c!==p.cell){p.cell=c;enterCell(p,c);}
  }
  if(p.alive&&p.tcells.length){const l=p.trail[p.trail.length-1];if(!l||Math.hypot(l.x-p.x,l.y-p.y)>5)p.trail.push({x:p.x,y:p.y});}
  if((p.boosting||p.pw.speed>0)&&p.moving&&Math.random()<0.5)G.particles.push({x:p.x-ca*R,y:p.y-sa*R,vx:rand(-20,20),vy:rand(-20,20),life:0.35,max:0.35,c:p.pw.speed>0?'#ffd166':'#ffffff',r:rand(2,4)});
}
function update(dt){
  if(!G)return;
  if(G.phase==='drop'){G.pt+=dt;if(AUTO&&!G.player.land&&G.pt>1)G.player.land=snapLand(CX+rand(-300,300),CY+rand(-300,300));if(G.pt>=DROP_T||G.jumpNow)startPara();updFx(dt);return;}
  if(G.phase==='para'){G.pt+=dt;if(G.pt>=PARA_T)landAll();updFx(dt);return;}
  G.t+=dt;zoneAt(G.t);
  const z=G.zone;
  const alive=G.players.filter(p=>p.alive);
  for(const p of alive){
    if(p.isPlayer&&!AUTO&&!G.demo){p.target=input.ang;p.boost=input.keyBoost||input.mouseBoost||input.btnBoost;}
    else{const ai=p.ai;ai.timer-=dt;if(ai.timer<=0){ai.timer=(0.2-0.1*ai.skill)*rand(0.8,1.2);botThink(p,alive);}ai.boostT-=dt;p.boost=ai.boostT>0;}
  }
  for(const p of alive){if(p.alive)movePlayer(p,dt);}
  // 道具箱
  for(let i=G.crates.length-1;i>=0;i--){const c=G.crates[i];
    for(const p of alive){if(!p.alive)continue;if(Math.abs(p.x-c.x)<R+14&&Math.abs(p.y-c.y)<R+14){G.crates.splice(i,1);burst(c.x,c.y,ITEMS[c.type].c,14);applyItem(p,c.type);break;}}}
  G.crateTimer-=dt;if(G.crateTimer<=0){G.crateTimer=1.4;if(G.crates.length<Math.max(6,26*(z.r/1260))&&z.r>120)spawnCrate(false);}
  if(G.t%1<dt)G.crates=G.crates.filter(c=>inZone(c.x,c.y)||G.t-c.born<1);
  // 正面相撞（双方都在领地外）
  for(let i=0;i<alive.length;i++){const a=alive[i];if(!a.alive||!a.tcells.length)continue;
    for(let j=i+1;j<alive.length;j++){const b=alive[j];if(!b.alive||!b.tcells.length)continue;
      if(Math.abs(a.x-b.x)<R*1.8&&Math.abs(a.y-b.y)<R*1.8&&dist(a,b)<R*1.8){
        const ca=cnt[a.id],cb=cnt[b.id];
        const m=Math.max(8,Math.max(ca,cb)*0.08);
        if(ca+m<cb)kill(a,b,'headon');else if(cb+m<ca)kill(b,a,'headon');
        else{// 势均力敌：互相弹开
          const ang=Math.atan2(b.y-a.y,b.x-a.x);const sd=angDiff(a.ang,ang)>0?-1:1;a.ang=a.target=a.ang+sd*1.2;b.ang=b.target=b.ang-sd*1.2;a.ai.timer=0;b.ai.timer=0;
          a.x-=Math.cos(ang)*6;a.y-=Math.sin(ang)*6;b.x+=Math.cos(ang)*6;b.y+=Math.sin(ang)*6;
          if(isMe(a)||isMe(b)){input.ang=isMe(a)?a.ang:b.ang;shake(4);}
          burst((a.x+b.x)/2,(a.y+b.y)/2,'#ffffff',10);}
        if(!a.alive)break;}}}
  // 毒圈
  for(const p of alive){
    if(!p.alive)continue;
    for(const k of PW_KEYS)if(p.pw[k]>0)p.pw[k]=Math.max(0,p.pw[k]-dt);
    if(p.inv>0)p.inv-=dt;
    if(!inZone(p.x,p.y)){p.outside+=dt;if(p.outside>=OUT_LIMIT){if(p.pw.shield>0){p.pw.shield=0;p.outside=0;burst(p.x,p.y,'#2ab7ff',18);if(isMe(p))addFloat('护盾抵挡毒圈！','#8fdcff');}else kill(p,null,'zone');}}
    else p.outside=Math.max(0,p.outside-dt*0.6);
  }
  // 圈外领地衰减
  {const zx=z.x,zy=z.y,zr2=z.r*z.r;let s=G.sweep;
    for(let k=0;k<3600;k++){s++;if(s>=N)s=0;const g=grid[s];if(g>=1&&g<=MAXP){const x=(s%GW+0.5)*CELL-zx,y=(((s/GW)|0)+0.5)*CELL-zy;if(x*x+y*y>zr2&&Math.random()<0.4)setOwner(s,0);}}
    G.sweep=s;}
  for(const p of G.players)if(p.alive&&cnt[p.id]<=0)kill(p,null,'zone');
  for(const p of G.players){p.pct=cnt[p.id]/landCells*100;if(p.alive&&p.pct>p.maxPct)p.maxPct=p.pct;}
  // 逐步显示圈地动画
  for(const rv of G.reveals){const n=Math.min(rv.cells.length,Math.ceil(rv.cells.length*(G.t-rv.start)/rv.dur));for(;rv.idx<n;rv.idx++)paint(rv.cells[rv.idx]);}

  // 胜负
  const aliveN=G.players.filter(p=>p.alive).length;G.aliveN=aliveN;
  if(G.demo){if(aliveN<=1||G.t>=G.zoneEnd){if(G.testHold){G.over=true;G.endT=G.t;return;}newGame(true);}return;}
  if(!G.over){

  }
}
function updFx(dt){

  if(G.particles.length>500)G.particles.splice(0,G.particles.length-500);
  for(const r of G.rings)r.t-=dt;G.rings=G.rings.filter(r=>r.t>0);
  for(const f of G.feed)f.t-=dt;G.feed=G.feed.filter(f=>f.t>0);
  for(const f of G.floats)f.t-=dt;G.floats=G.floats.filter(f=>f.t>0);

      ctx.globalAlpha=cloaked?(isMe(p)||(G.demo&&p.isPlayer)?0.28:0.07):0.9;
      ctx.strokeStyle=PAL[p.pi].trail;ctx.lineWidth=7;ctx.beginPath();
      const tr=p.trail;ctx.moveTo(tr[0].x,tr[0].y);for(let i=1;i<tr.length;i++)ctx.lineTo(tr[i].x,tr[i].y);ctx.lineTo(p.x,p.y);ctx.stroke();
      if(!cloaked){ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;ctx.stroke();}
    }
    ctx.globalAlpha=1;
    const order=G.players.filter(p=>p.alive&&p.x>x0-40&&p.x<x1+40&&p.y>y0-40&&p.y<y1+40).sort((a,b)=>a.y-b.y);
    for(const p of order)drawAvatar(p,1,p.pw.cloak>0?(isMe(p)?0.6:0.5):1);
  }else if(G.phase==='para'){
    const k=clamp(G.pt/PARA_T,0,1);
    for(const p of G.players)if(!p.isPlayer)drawParachute(p,k);drawParachute(G.player,k);
  }
  // 粒子与光环
  for(const r of G.rings){const k=1-r.t/r.life;ctx.globalAlpha=Math.max(0,1-k);ctx.strokeStyle=r.c;ctx.lineWidth=5*(1-k)+1;ctx.beginPath();ctx.arc(r.x,r.y,r.r+(r.max-r.r)*k,0,TAU);ctx.stroke();}
  for(const p of G.particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  for(const f of G.wfloats){ctx.globalAlpha=Math.min(1,f.t*2);const fs=(f.big?22:17)/z;ctx.font='900 '+fs+'px sans-serif';ctx.textAlign='center';ctx.lineWidth=4/z;ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle='#fff';ctx.fillText(f.text,f.x,f.y);}
  ctx.globalAlpha=1;
  // 安全区
  if(G.phase==='play'){
    const zn=G.zone;
    ctx.beginPath();ctx.rect(x0-20,y0-20,vw+40,vh+40);ctx.arc(zn.x,zn.y,Math.max(0.5,zn.r),0,TAU,true);
    ctx.fillStyle='rgba(70,60,200,0.28)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=5/Math.max(0.5,z);ctx.beginPath();ctx.arc(zn.x,zn.y,Math.max(0.5,zn.r),0,TAU);ctx.stroke();
    if(zn.nr>0&&zn.phase!=='done'){ctx.setLineDash([18,14]);ctx.strokeStyle='rgba(255,255,255,0.65)';ctx.lineWidth=3/Math.max(0.5,z);ctx.beginPath();ctx.arc(zn.nx,zn.ny,zn.nr,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  }
  // 跳伞阶段
  if(G.phase==='drop'){
    const pl=G.plane,k=clamp(G.pt/DROP_T,0,1),px=pl.ax+(pl.bx-pl.ax)*k,py=pl.ay+(pl.by-pl.ay)*k;
    ctx.setLineDash([30/1,24]);ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(pl.ax,pl.ay);ctx.lineTo(pl.bx,pl.by);ctx.stroke();ctx.setLineDash([]);
    ctx.save();ctx.translate(px,py);ctx.rotate(pl.ang);const s=4.2;
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(10*s,30*s,24*s,7*s,0,0,TAU);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.strokeStyle='#4a5a7a';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(-4*s,-22*s);ctx.lineTo(6*s,-22*s);ctx.lineTo(4*s,0);ctx.lineTo(6*s,22*s);ctx.lineTo(-4*s,22*s);ctx.lineTo(-8*s,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,0,24*s,6*s,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-20*s,0);ctx.lineTo(-26*s,-9*s);ctx.lineTo(-22*s,0);ctx.lineTo(-26*s,9*s);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff6b9a';ctx.beginPath();ctx.ellipse(14*s,0,5*s,3.4*s,0,0,TAU);ctx.fill();
    ctx.restore();
    const L=G.player.land;
    if(L){const bounce=Math.abs(Math.sin(t*5))*16;ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(L.x,L.y,30,10,0,0,TAU);ctx.fill();
      ctx.fillStyle='#ffc23c';ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.beginPath();ctx.arc(L.x,L.y-70-bounce,34,Math.PI*0.85,Math.PI*0.15);ctx.lineTo(L.x,L.y-bounce);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(L.x,L.y-72-bounce,13,0,TAU);ctx.fill();
      ctx.font='bold '+(14/z)+'px sans-serif';ctx.textAlign='center';ctx.lineWidth=4/z;ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.strokeText('你的落点',L.x,L.y-130-bounce);ctx.fillStyle='#ffe066';ctx.fillText('你的落点',L.x,L.y-130-bounce);}
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawHUD();
}
function drawHUD(){
  if(state==='menu'||!G)return;
  const pl=G.player,pad=10,L=pad+SAFE.l,T=pad+SAFE.t,RR=W-pad-SAFE.r,B=H-pad-SAFE.b,cx=(L+RR)/2;
  ctx.textBaseline='alphabetic';
  if(G.phase==='drop'){
    const left=Math.max(0,DROP_T-G.pt);
    const msg=pl.land?'已选好落点，点「就这里，跳！」或等待自动跳伞':'点击地图，选择你的跳伞地点';
    ctx.font='bold 16px sans-serif';const mw=ctx.measureText(msg).width+34;pill(cx-mw/2,T,mw,34,0.55);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(msg,cx,T+23);
    roundRect(L,T+46,104,78,18);ctx.fillStyle='rgba(20,40,70,0.5)';ctx.fill();
    ctx.font='900 38px sans-serif';ctx.fillStyle='#ffe066';ctx.fillText(Math.ceil(left)+'',L+52,T+90);
    ctx.font='12px sans-serif';ctx.fillStyle='#fff';ctx.fillText('秒后自动跳伞',L+52,T+112);
    drawFloats(cx);
    return;
  }
  if(G.phase==='para'){ctx.textAlign='center';ctx.font='900 26px sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(20,40,70,0.5)';ctx.strokeText('跳伞中……',cx,T+30);ctx.fillStyle='#fff';ctx.fillText('跳伞中……',cx,T+30);return;}
  // 左上信息
  roundRect(L,T,158,56,16);ctx.fillStyle='rgba(20,40,70,0.45)';ctx.fill();
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.fillText('剩余 '+G.aliveN+' 人',L+14,T+26);
  ctx.font='13px sans-serif';ctx.fillStyle='#ffe9a8';ctx.fillText('领地 '+pl.pct.toFixed(1)+'%   击杀 '+pl.kills,L+14,T+46);
  // 小地图
  const ms=Math.max(76,Math.min(112,Math.min(W,H)*0.28)),mx0=RR-ms,my0=T;
  ctx.save();roundRect(mx0,my0,ms,ms,14);ctx.fillStyle='rgba(70,170,220,0.85)';ctx.fill();ctx.clip();
  ctx.drawImage(islC,mx0,my0,ms,ms);ctx.drawImage(terrC,mx0,my0,ms,ms);
  const sc=ms/WORLD,zn=G.zone;
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mx0+zn.x*sc,my0+zn.y*sc,Math.max(0.5,zn.r*sc),0,TAU);ctx.stroke();
  if(zn.nr>0){ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(mx0+zn.nx*sc,my0+zn.ny*sc,zn.nr*sc,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  for(const p of G.players){if(!p.alive||p===pl)continue;ctx.fillStyle=PAL[p.pi].dark;ctx.beginPath();ctx.arc(mx0+p.x*sc,my0+p.y*sc,2,0,TAU);ctx.fill();}
  if(pl.alive){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx0+pl.x*sc,my0+pl.y*sc,3.5,0,TAU);ctx.fill();ctx.strokeStyle='#ff6b9a';ctx.lineWidth=2;ctx.stroke();}
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2;roundRect(mx0,my0,ms,ms,14);ctx.stroke();
  // 领地榜
  const rk=G.players.filter(p=>p.alive).sort((a,b)=>cnt[b.id]-cnt[a.id]);
  let ly=my0+ms+18;ctx.font='12px sans-serif';ctx.textAlign='right';
  const myR=rk.indexOf(pl)+1;
  const rows=rk.slice(0,3).map((p,i)=>[i+1,p]);if(pl.alive&&myR>3)rows.push([myR,pl]);
  if(H>300)for(const [i,p] of rows){ctx.fillStyle=p===pl?'#ffe066':'#ffffff';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.3)';const s=i+'. '+(p===pl?'你':p.name)+'  '+p.pct.toFixed(1)+'%';ctx.strokeText(s,RR,ly);ctx.fillText(s,RR,ly);ctx.fillStyle=PAL[p.pi].main;ctx.fillRect(RR-ctx.measureText(s).width-12,ly-9,8,8);ly+=16;}
  // 安全区提示
  let msg,col='#ffffff';
  if(zn.phase==='hold')msg='安全区 '+Math.ceil(zn.left)+' 秒后缩小（'+(zn.stage+1)+'/'+G.zst.length+'）';
  else if(zn.phase==='shrink'){msg=zn.stage===G.zst.length-1?'决赛圈收缩！'+Math.ceil(zn.left)+' 秒后领地最大者吃鸡':'安全区缩小中！';col='#ffd0e0';}
  else{msg='决赛圈！';col='#ff8080';}
  ctx.font='bold 14px sans-serif';const mw=ctx.measureText(msg).width+28;
  const narrow=(cx-mw/2<L+162)||(cx+mw/2>mx0-8);
  const zy=narrow?T+64:T;
  pill(cx-mw/2,zy,mw,28);ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText(msg,cx,zy+19);
  // 道具状态
  const act=PW_KEYS.filter(k=>pl.alive&&pl.pw[k]>0);
  if(act.length){const iw=112,gap=8,tw=act.length*iw+(act.length-1)*gap;let x=cx-tw/2;const y=zy+36;
    for(const k of act){const v=pl.pw[k],I=ITEMS[k];pill(x,y,iw,28,0.5);
      ctx.fillStyle=I.c;ctx.beginPath();ctx.arc(x+14,y+14,10,0,TAU);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(I.ch,x+14,y+15);
      ctx.textAlign='left';ctx.font='12px sans-serif';ctx.fillText(I.name+' '+Math.ceil(v)+'s',x+29,y+11);
      ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(x+29,y+18,72,4);ctx.fillStyle=I.c;ctx.fillRect(x+29,y+18,72*v/I.dur,4);
      ctx.textBaseline='alphabetic';x+=iw+gap;}}
  // 击杀播报
  ctx.textAlign='left';ctx.font='13px sans-serif';let fy=T+76;
  G.feed.slice(0,H<450?3:5).forEach(f=>{ctx.globalAlpha=Math.min(1,f.t);ctx.lineWidth=3.5;ctx.strokeStyle='rgba(20,30,50,0.6)';ctx.strokeText(f.text,L+4,fy);ctx.fillStyle=f.me?'#ffe066':'#ffffff';ctx.fillText(f.text,L+4,fy);fy+=18;});
  ctx.globalAlpha=1;
  // 圈外警告
  if(pl.alive&&pl.outside>0){const left=Math.max(0,OUT_LIMIT-pl.outside);ctx.textAlign='center';ctx.font='bold 22px sans-serif';ctx.fillStyle=Math.floor(G.t*6)%2?'#ff4d6d':'#ffffff';
    const wy=Math.max(zy+100,H*0.36);ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,0.35)';const s='你在毒圈外！'+left.toFixed(1)+' 秒';ctx.strokeText(s,cx,wy);ctx.fillText(s,cx,wy);
    ctx.font='14px sans-serif';ctx.fillStyle='#fff';ctx.fillText('快回到白色圆圈内',cx,wy+22);}
  drawFloats(cx);
  // 摇杆
  if(state==='game'&&pl.alive&&TOUCH){
    if(input.joy){const j=input.joy;ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.arc(j.ox,j.oy,JOY_R,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(j.x,j.y,26,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,107,154,0.9)';ctx.lineWidth=3;ctx.stroke();}
    else{const gx=L+JOY_R+30,gy=B-JOY_R-20;ctx.globalAlpha=G.t<8?0.55:0.2;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([6,8]);ctx.beginPath();ctx.arc(gx,gy,JOY_R,0,TAU);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx,gy,22,0,TAU);ctx.fill();
      if(G.t<8){ctx.globalAlpha=0.9;ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.strokeText('左手按住拖动转向',gx,gy-JOY_R-10);ctx.fillText('左手按住拖动转向',gx,gy-JOY_R-10);}
      ctx.globalAlpha=1;}
  }
}
function drawFloats(cx){
  ctx.textAlign='center';
  G.floats.forEach((f,i)=>{ctx.globalAlpha=Math.min(1,f.t*1.5);ctx.font='bold 22px sans-serif';const y=H*0.55-(1.6-f.t)*30-i*28;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.strokeText(f.text,cx,y);ctx.fillStyle=f.color;ctx.fillText(f.text,cx,y);});
  ctx.globalAlpha=1;
}
function updateCam(dt){
  if(!G)return;
  if(G.phase==='drop'){cam.x=CX;cam.y=CY;cam.z=fitZ();}
  else if(G.phase==='para'){const k=clamp(G.pt/PARA_T,0,1),e=k*k*(3-2*k),L=G.player.land;cam.x=CX+(L.x-CX)*e;cam.y=CY+(L.y-CY)*e;cam.z=fitZ()+(playZ()-fitZ())*e;}
  else{
    let tg=G.player.alive?G.player:null;if(!tg&&G.demo)tg=G.players.find(p=>p.alive);
    if(tg){const k=1-Math.exp(-dt*8);cam.x+=(tg.x-cam.x)*k;cam.y+=(tg.y-cam.y)*k;}
    const pz=playZ();cam.z+=(pz-cam.z)*(1-Math.exp(-dt*3));
  }
  cam.shake=Math.max(0,cam.shake-dt*30);cam.sx=rand(-1,1)*cam.shake;cam.sy=rand(-1,1)*cam.shake;
}
let lastE=-1;
function updBoostUI(){
  if(!G||G.phase!=='play')return;
  const e=G.player.energy;if(Math.abs(e-lastE)<0.02)return;lastE=e;
  bb.style.background='conic-gradient(#ffffff '+(e*360).toFixed(0)+'deg, rgba(255,255,255,.22) 0)';
  bb.classList.toggle('low',e<0.05);
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  const paused=PORTRAIT&&state==='game';
  if(G&&!paused){if(input.mouseAim&&state==='game')aimFromMouse();update(dt);}
  updateCam(dt);draw();updBoostUI();
  requestAnimationFrame(frame);
}
newGame(true);
if(AUTO)startGame();
requestAnimationFrame(frame);
window.__land={get G(){return G;},get state(){return state;},get cnt(){return cnt;},landCells:()=>landCells,
  sim(sec,step){step=step||1/30;for(let t=0;t<sec;t+=step){update(step);if(G.over)break;}return {t:G.t,phase:G.phase,alive:G.aliveN,over:G.over,result:G.result};},start:startGame};
})();
</script>
