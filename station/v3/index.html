:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--neon:#3df2ff;--neon2:#b26bff}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;background:#05071a;touch-action:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;-webkit-tap-highlight-color:transparent;color:#e8f6ff}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}

.overlay{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;background:rgba(3,5,20,.62);z-index:10;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.hidden{display:none!important}
.card{position:relative;background:linear-gradient(165deg,rgba(18,30,78,.96),rgba(10,12,40,.97));border:1px solid rgba(61,242,255,.45);border-radius:22px;padding:22px 20px 18px;width:min(86vw,360px);max-height:86vh;overflow:auto;text-align:center;box-shadow:0 0 0 1px rgba(178,107,255,.2) inset,0 16px 50px rgba(0,0,0,.6),0 0 36px rgba(61,242,255,.22);box-sizing:border-box;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
.card:before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--neon),transparent)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
h2{margin:4px 0 4px;font-size:26px;letter-spacing:3px;color:#fff;text-shadow:0 0 14px var(--neon)}
.en{font-size:11px;letter-spacing:4px;color:var(--neon);opacity:.8;margin-bottom:10px}
.sub{color:#a8c4e8;font-size:14px;line-height:1.6;margin:6px 0 12px}
.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0 0;padding:13px 10px;border:0;border-radius:14px;font-size:18px;font-weight:800;letter-spacing:2px;color:#04121e;background:linear-gradient(180deg,#7ff8ff,#2bc8ea);box-shadow:0 4px 0 #137a96,0 0 18px rgba(61,242,255,.45);font-family:inherit;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #137a96}
.btn.alt{background:linear-gradient(180deg,#3a3f72,#262a55);color:#dfe8ff;box-shadow:0 4px 0 #15173a}
.btn.ad{background:linear-gradient(180deg,#ffe27a,#ffb627);box-shadow:0 4px 0 #a86d00,0 0 18px rgba(255,200,60,.45)}
.btn small{display:block;font-size:12px;font-weight:600;letter-spacing:1px;opacity:.75}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0 2px;height:56px}
.stars span{display:inline-block;color:#2b3266;transform:scale(.4);transition:transform .35s cubic-bezier(.2,1.6,.4,1),color .2s}
.stars span.on{color:#ffd23f;transform:scale(1);text-shadow:0 0 16px #ffb000}
.reward{font-size:17px;color:#ffd96a;font-weight:800;margin:4px 0 6px}
#lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 6px}
.lv{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid rgba(61,242,255,.4);background:rgba(30,50,110,.55);color:#e8f6ff;font-size:18px;font-weight:800;font-family:inherit;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.lv i{font-style:normal;font-size:9px;color:#ffd23f;letter-spacing:1px;height:11px}
.lv.cur{border-color:#ffd23f;box-shadow:0 0 12px rgba(255,210,63,.6)}
.lv.lock{opacity:.35;cursor:default}
.chap{display:flex;align-items:center;gap:10px;text-align:left;margin:10px 0 4px;padding:10px 12px;border-radius:14px;background:rgba(61,242,255,.08);border:1px solid rgba(61,242,255,.25)}
.chap b{font-size:16px}.chap span{font-size:11px;color:#9fb6d8;display:block}
.chap .dot{width:30px;height:30px;border-radius:50%;flex:none}
.chap.soon{opacity:.85;border-style:dashed;cursor:pointer}
.coin{color:#ffd96a;font-weight:800}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:20;padding:10px 18px;border-radius:14px;background:rgba(8,14,44,.92);border:1px solid var(--neon);color:#fff;font-size:15px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;box-shadow:0 0 18px rgba(61,242,255,.35)}
#toast.show{opacity:1}
#adTimer{font-size:44px;font-weight:900;color:#ffd23f;margin:10px 0}
</style>
</head>

}
function drawDocks(LY,T){
  var sh=G.dockShake>0?Math.sin(G.dockShake*60)*G.dockShake*10:0;if(G.dockShake>0)G.dockShake-=S.dt;
  var dragC=G.dockDrag&&G.dockDrag.moved?G.dockDrag.c:null;
  LY.slots.forEach(function(sl,k){
    var x=sl.x+sh,col=sl.vip?T.neon2:T.neon,c=G.slotCraft[k];
    ctx.save();var bgc=ctx.createLinearGradient(0,sl.y,0,sl.y+sl.h);bgc.addColorStop(0,sl.vip?'rgba(178,107,255,0.16)':'rgba(61,242,255,0.08)');bgc.addColorStop(1,'rgba(0,0,0,0.25)');ctx.fillStyle=bgc;rr(ctx,x,sl.y,sl.w,sl.h,10);ctx.fill();
    var tgt=dragC&&c&&c!==dragC&&c.st==='dock';var okT=tgt&&c.dest===dragC.dest&&c.fill<c.cap;
    ctx.setLineDash(c?[]:[5,4]);ctx.strokeStyle=okT?'#7dffb0':tgt?'rgba(255,90,120,.6)':hexA(col,c?0.9:0.45);ctx.lineWidth=okT?3:c?2:1.3;if(c||okT){ctx.shadowColor=okT?'#7dffb0':col;ctx.shadowBlur=okT?18:8;}rr(ctx,x+1,sl.y+1,sl.w-2,sl.h-2,10);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    // 夹钳
    var cl=c&&c.st==='dock'?c.clamp:0,cy2=sl.y+sl.h/2-5,gapc=LY.dockSz*0.5+(1-cl)*8;
    ctx.fillStyle=hexA(col,0.55+cl*0.4);rr(ctx,x+sl.w/2-gapc-5,cy2-8,5,16,2);ctx.fill();rr(ctx,x+sl.w/2+gapc,cy2-8,5,16,2);ctx.fill();
    ctx.fillStyle=hexA(col,0.3);ctx.fillRect(x+3,cy2-1,sl.w/2-gapc-8,2);ctx.fillRect(x+sl.w/2+gapc+5,cy2-1,sl.w/2-gapc-8,2);
    if(sl.vip&&!c){ctx.save();ctx.translate(x+sl.w/2,sl.y+sl.h-10);ctx.fillStyle=hexA(T.neon2,0.85);ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(5,0);ctx.lineTo(0,5);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();ctx.restore();}
  });
  G.crafts.forEach(function(c){if(c.st==='dock'&&c!==dragC)drawCraft(c,LY,T);});
  LY.slots.forEach(function(sl,k){var c=G.slotCraft[k];if(!c||c.st!=='dock')return;var x=sl.x+sh,full=c.fill>=c.cap;
    ctx.fillStyle='rgba(4,8,26,.85)';rr(ctx,x+3,sl.y+sl.h-17,sl.w-6,14,7);ctx.fill();
    drawPlanet(ctx,c.dest,x+11,sl.y+sl.h-10,4.5);ctx.fillStyle=full?'#7dffb0':'#fff';ctx.font='800 '+Math.round(10*LY.sc)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.fill+'/'+c.cap,x+sl.w/2+5,sl.y+sl.h-10);
    if(c.parts.length>1){bubble(x+sl.w-12,sl.y+8,'×'+c.parts.length,T.gold);}});
  // 光桥
  if(G.bridge&&G.bridge.t>0){G.bridge.t-=S.dt;var b=G.bridge.c,gp=LY.gate;ctx.save();ctx.globalAlpha=Math.min(1,G.bridge.t*4);var lg=ctx.createLinearGradient(gp.x,gp.y,b.px,b.py);lg.addColorStop(0,hexA(PLANETS[b.dest].c,0.15));lg.addColorStop(1,hexA(PLANETS[b.dest].c,0.75));ctx.strokeStyle=lg;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(gp.x,gp.y);ctx.lineTo(b.px,b.py-b.sz*0.2);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}
  if(dragC)drawCraft(dragC,LY,T,1.12);
}
function drawFlying(LY,T){
  G.crafts.forEach(function(c){
    if(c.st==='taxi'||c.st==='roll'||c.st==='fly'||c.st==='merged')drawCraft(c,LY,T,c.st==='merged'?0.9:1.05);
    if(c.st==='beam'){ctx.save();ctx.strokeStyle=hexA(T.neon2,0.45);ctx.lineWidth=c.sz*0.8;ctx.lineCap='round';var sl=LY.slots[0];ctx.beginPath();ctx.moveTo(sl.x+sl.w/2,sl.y+sl.h/2);ctx.lineTo(c.px,c.py);ctx.stroke();ctx.restore();drawCraft(c,LY,T,1.05);}
    if(c.st==='warp'){ctx.save();ctx.globalAlpha=Math.max(0,1-c.t*1.1);drawCraft(c,LY,T,1+c.t*0.5);ctx.restore();}
  });
  G.fliers.forEach(function(f){var e=f.t/f.dur,tx=f.c.px,ty=f.c.py-f.c.sz*0.1;var x=f.x0+(tx-f.x0)*e,y=f.y0+(ty-f.y0)*e-Math.sin(e*Math.PI)*34;drawTraveler(f.d,x,y,LY.qsp*0.55,{sc:1-e*0.45});});
}
function drawFx(LY,T){
  for(var k=G.streaks.length-1;k>=0;k--){var st=G.streaks[k];st.life-=S.dt;st.y-=1000*S.dt;if(st.life<=0){G.streaks.splice(k,1);continue;}ctx.strokeStyle=st.c;ctx.globalAlpha=Math.min(1,st.life*4);ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(st.x,st.y);ctx.lineTo(st.x,st.y+st.len);ctx.stroke();ctx.globalAlpha=1;}
  for(var w=G.welds.length-1;w>=0;w--){var wd=G.welds[w];wd.t+=S.dt;if(wd.t>0.7){G.welds.splice(w,1);continue;}var r=wd.t*140;ctx.strokeStyle=hexA(PLANETS[wd.c.dest].c,1-wd.t/0.7);ctx.lineWidth=3;ctx.beginPath();ctx.arc(wd.c.px,wd.c.py,r,0,TAU);ctx.stroke();
    ctx.fillStyle=hexA('#ffffff',1-wd.t/0.7);ctx.font='900 '+Math.round(18*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';ctx.textAlign='center';ctx.fillText('合体！',wd.c.px,wd.c.py-LY.dockSz*0.6-wd.t*30);}
  for(var q=G.fx.length-1;q>=0;q--){var fx=G.fx[q];fx.life-=S.dt;if(fx.life<=0){G.fx.splice(q,1);continue;}fx.x+=fx.vx*S.dt;fx.y+=fx.vy*S.dt;fx.vx*=0.96;fx.vy*=0.96;ctx.globalAlpha=fx.life/fx.max;ctx.fillStyle=fx.c;ctx.fillRect(fx.x-fx.r/2,fx.y-fx.r/2,fx.r,fx.r);}ctx.globalAlpha=1;
  for(var i=G.rip.length-1;i>=0;i--){var rp=G.rip[i];rp.t+=S.dt;if(rp.t>0.4){G.rip.splice(i,1);continue;}ctx.strokeStyle=rp.c;ctx.globalAlpha=1-rp.t/0.4;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(rp.x,rp.y,8+rp.t*90,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
}
function hand(x,y,LY){ctx.save();ctx.font=Math.round(32*LY.sc)+'px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('👆',x-8,y);ctx.restore();}
function drawHints(LY,T){
  if(G.mode!=='play'||G.paused||G.vipArm||G.drag||G.dockDrag)return;
  var idle=G.t-G.lastAct;if(!(G.lv<=2||(G.lv===4&&S.mergePair())||idle>9))return;
  if(S.busy())return;var h=S.computeHint();if(!h)return;
  if(h.type==='tap'){var p=S.slotPos(h.slot);ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.5*Math.sin(G.t*6))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,LY.shipSz*0.7,0,TAU);ctx.stroke();hand(p.x,p.y+4+Math.sin(G.t*6)*4,LY);}
  else if(h.type==='merge'){var A=h.a,B=h.b,ph2=(G.t*0.7)%1,e=ph2<.15?0:ph2>.85?1:(ph2-.15)/.7;var x2=A.px+(B.px-A.px)*e,y2=A.py+(B.py-A.py)*e;
    ctx.strokeStyle='rgba(125,255,176,.8)';ctx.lineWidth=2.5;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(A.px,A.py);ctx.lineTo(B.px,B.py);ctx.stroke();ctx.setLineDash([]);hand(x2,y2,LY);}
}
function drawHud(LY,T){
  var t=LY.top,bh=LY.barH,sv=S.save();
  iconBtn(LY.btnMenu,'☰',T);iconBtn(LY.btnRestart,'↻',T);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='900 '+Math.round(19*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';ctx.save();ctx.shadowColor=T.neon;ctx.shadowBlur=10;ctx.fillText('第 '+G.lv+' 关',LY.ox+LY.CW/2,t+bh/2-7);ctx.restore();
  ctx.font='600 '+Math.round(10*LY.sc)+'px sans-serif';var over=G.moves>G.L.par;ctx.fillStyle=over?'#ff9aa8':hexA(T.neon,0.9);
  ctx.fillText('⟳ '+G.moves+' / '+G.L.par+'    ◎ '+sv.coins,LY.ox+LY.CW/2,t+bh/2+11);
  var b=LY.btnVip,on=G.L.vip>0,arm=G.vipArm,pulse=G.nag==='vip'?0.5+0.5*Math.sin(G.t*10):0;
  ctx.save();ctx.globalAlpha=on?1:0.45;var g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);g.addColorStop(0,arm?'#d9a6ff':'#7b4dd6');g.addColorStop(1,arm?'#9b5cff':'#3e2482');ctx.fillStyle=g;rr(ctx,b.x,b.y,b.w,b.h,14);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.15)';rr(ctx,b.x+2,b.y+2,b.w-4,b.h*0.45,12);ctx.fill();
  ctx.strokeStyle=hexA(T.neon2,0.6+pulse*0.4);ctx.lineWidth=2+pulse*3;ctx.shadowColor=T.neon2;ctx.shadowBlur=8+pulse*16;rr(ctx,b.x,b.y,b.w,b.h,14);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='800 '+Math.round(14*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(arm?'◎ 点选飞船…':'◎ 引力牵引',b.x+12,b.y+b.h/2);
  ctx.textAlign='right';ctx.fillStyle='#ffe27a';ctx.fillText(on?(G.vipUses>0?'×'+G.vipUses:'30◎'):'🔒',b.x+b.w-12,b.y+b.h/2);ctx.restore();
  // 中间：合体次数
  iconBtn(LY.btnMute,sv.mute?'🔇':'🔊',T);
  var tip=G.L.tip;if(tip&&G.taps<3&&G.mode==='play'&&G.banner<=0){ctx.font='700 '+Math.round(12*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';var tw=LY.hall.w-30,lines=wrap(tip,tw-24).slice(0,2),th=lines.length*16+12,ty=LY.hall.y+28;
    ctx.fillStyle='rgba(4,10,30,0.9)';rr(ctx,LY.ox+LY.CW/2-tw/2,ty,tw,th,10);ctx.fill();ctx.strokeStyle=hexA(T.gold,0.8);ctx.lineWidth=1.2;rr(ctx,LY.ox+LY.CW/2-tw/2,ty,tw,th,10);ctx.stroke();
    ctx.fillStyle='#fff3d0';ctx.textAlign='center';lines.forEach(function(l,i){ctx.fillText(l,LY.ox+LY.CW/2,ty+14+i*16);});}
  if(G.banner>0){G.banner-=S.dt;var a=Math.min(1,G.banner*2);ctx.save();ctx.globalAlpha=a;var bw2=240*LY.sc,y=LY.cy;ctx.fillStyle='rgba(4,10,30,0.8)';rr(ctx,LY.ox+LY.CW/2-bw2/2,y-32,bw2,64,16);ctx.fill();ctx.strokeStyle=T.neon;ctx.lineWidth=1.5;rr(ctx,LY.ox+LY.CW/2-bw2/2,y-32,bw2,64,16);ctx.stroke();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 '+Math.round(22*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';ctx.fillText('第 '+G.lv+' 关',LY.ox+LY.CW/2,y-7);ctx.font='600 '+Math.round(11*LY.sc)+'px sans-serif';ctx.fillStyle=T.neon;
    ctx.fillText(G.q.length+' 位旅客 · '+G.L.ships.length+' 艘飞船',LY.ox+LY.CW/2,y+15);ctx.restore();}
}
function wrap(t,maxW){var out=[],cur='';for(var i=0;i<t.length;i++){var c2=cur+t[i];if(ctx.measureText(c2).width>maxW&&cur){out.push(cur);cur=t[i];}else cur=c2;}if(cur)out.push(cur);return out;}
function iconBtn(r,ch,T){var g=ctx.createLinearGradient(0,r.y,0,r.y+r.h);g.addColorStop(0,'rgba(26,40,96,.95)');g.addColorStop(1,'rgba(10,16,48,.95)');ctx.fillStyle=g;rr(ctx,r.x,r.y+2,r.w,r.h-4,12);ctx.fill();ctx.strokeStyle=hexA(T.neon,0.55);ctx.lineWidth=1;rr(ctx,r.x,r.y+2,r.w,r.h-4,12);ctx.stroke();ctx.fillStyle='#e8f6ff';ctx.font='700 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,r.x+r.w/2,r.y+r.h/2+1);}

// ---------- 界面 ----------
function $(id){return document.getElementById(id);}
function clearToast(){$('toast').classList.remove('show');}
window.hideAll=function(){['menu','win','lose','ad'].forEach(function(i){$(i).classList.add('hidden');});G.paused=false;};
window.openMenu=function(){
  G.paused=true;var sv=S.save();$('mCoins').textContent=sv.coins;var gr=$('lvGrid');gr.innerHTML='';
  $('chap1dot').style.background='radial-gradient(circle at 35% 35%,#ff7ad9,#8a6bff 55%,#2a1a66)';$('chap2dot').style.background='radial-gradient(circle at 35% 35%,#9fd8ff,#3b7bff 55%,#0b1f55)';
  S.LEVELS.forEach(function(_,i){var n=i+1,b=document.createElement('button');b.className='lv'+(n>sv.unlocked?' lock':'')+(n===G.lv?' cur':'');var st=sv.stars[n]||0;
    b.innerHTML=(n>sv.unlocked?'🔒':n)+'<i>'+(st?'★★★'.slice(0,st):'')+'</i>';b.dataset.lv=n;b.onclick=function(){if(n>sv.unlocked)return;S.loadLevel(n);};gr.appendChild(b);});
  $('chap1name').textContent=THEMES.ring.name+(G.themeId==='ring'?' · 当前':'');$('menu').classList.remove('hidden');
};
$('mClose').onclick=function(){hideAll();};
$('chap2').onclick=function(){G.themeId=G.themeId==='moon'?'ring':'moon';hideAll();S.loadLevel(G.lv);
  document.documentElement.style.setProperty('--neon',S.theme().neon);document.documentElement.style.setProperty('--neon2',S.theme().neon2);
  setTimeout(function(){var t=$('toast');t.textContent=G.themeId==='moon'?'月球港外观预览（再点一次切回）':'回到星环空间站';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1600);},50);};
window.showWin=function(){clearToast();
  $('wReward').textContent='+'+G.starsGot*10+' 星币';
  $('wSub').textContent=G.lv>=S.LEVELS.length?'第一站全部完成！月球港即将开放':'转动 '+G.moves+' 格（目标 ≤'+G.L.par+'）· 合体 '+G.merges+' 次'+(G.revived?' · 用了增援登舱口':'');
  $('wNext').textContent=G.lv>=S.LEVELS.length?'回到关卡列表':'下一关';
  var sp=$('wStars').children;for(var i=0;i<3;i++)sp[i].className='';$('win').classList.remove('hidden');
  for(var j=0;j<G.starsGot;j++)(function(j){setTimeout(function(){sp[j].className='on';S.SFX.board(8+j*6);},250+j*260);})(j);
};
$('wNext').onclick=function(){if(G.lv>=S.LEVELS.length){openMenu();return;}S.loadLevel(G.lv+1);};
$('wMenu').onclick=function(){openMenu();};
window.showLose=function(){clearToast();$('lAd').classList.toggle('hidden',G.revived);$('lSub').textContent=G.revived?'增援登舱口也满了，换个调度顺序再试一次':'停靠的飞船都等不到对应星球的旅客了';$('lose').classList.remove('hidden');};
$('lRetry').onclick=function(){S.loadLevel(G.lv);};
$('lAd').onclick=function(){$('lose').classList.add('hidden');$('ad').classList.remove('hidden');var n=3;$('adTimer').textContent=n;
  var iv=setInterval(function(){n--;$('adTimer').textContent=n;if(n<=0){clearInterval(iv);S.revive();}},G.fastAd?60:800);};

// ---------- 主循环 ----------
var last=performance.now();S.dt=0;S.frames=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;S.dt=dt;S.frames++;
  if(!G.paused){G.t+=dt;S.updRing(dt);S.updBays(dt);S.updCrafts(dt);S.updBoard(dt);S.updFliers(dt);S.checkEnd(dt);}else S.dt=0;
  render();requestAnimationFrame(frame);
}
S.layout();S.loadLevel(S.save().cur||1);
document.documentElement.style.setProperty('--neon',S.theme().neon);document.documentElement.style.setProperty('--neon2',S.theme().neon2);
requestAnimationFrame(frame);
})();

</script>
