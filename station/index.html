<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--neon:#3df2ff;--neon2:#b26bff}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;background:#05071a;touch-action:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;-webkit-tap-highlight-color:transparent;color:#e8f6ff}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
.overlay{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;background:rgba(3,5,20,.62);z-index:10;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.hidden{display:none!important}
.card{position:relative;background:linear-gradient(165deg,rgba(18,30,78,.96),rgba(10,12,40,.97));border:1px solid rgba(61,242,255,.45);border-radius:22px;padding:22px 20px 18px;width:min(86vw,360px);max-height:86vh;overflow:auto;text-align:center;box-shadow:0 0 0 1px rgba(178,107,255,.2) inset,0 16px 50px rgba(0,0,0,.6),0 0 36px rgba(61,242,255,.22);box-sizing:border-box;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
.card:before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--neon),transparent)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
h2{margin:4px 0 4px;font-size:26px;letter-spacing:3px;color:#fff;text-shadow:0 0 14px var(--neon)}
.en{font-size:11px;letter-spacing:4px;color:var(--neon);opacity:.8;margin-bottom:10px}
.sub{color:#a8c4e8;font-size:14px;line-height:1.6;margin:6px 0 12px}
.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0 0;padding:13px 10px;border:0;border-radius:14px;font-size:18px;font-weight:800;letter-spacing:2px;color:#04121e;background:linear-gradient(180deg,#7ff8ff,#2bc8ea);box-shadow:0 4px 0 #137a96,0 0 18px rgba(61,242,255,.45);font-family:inherit;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #137a96}
.btn.alt{background:linear-gradient(180deg,#3a3f72,#262a55);color:#dfe8ff;box-shadow:0 4px 0 #15173a}
.btn.ad{background:linear-gradient(180deg,#ffe27a,#ffb627);box-shadow:0 4px 0 #a86d00,0 0 18px rgba(255,200,60,.45)}
.btn small{display:block;font-size:12px;font-weight:600;letter-spacing:1px;opacity:.75}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0 2px;height:56px}
.stars span{display:inline-block;color:#2b3266;transform:scale(.4);transition:transform .35s cubic-bezier(.2,1.6,.4,1),color .2s}
.stars span.on{color:#ffd23f;transform:scale(1);text-shadow:0 0 16px #ffb000}
.reward{font-size:17px;color:#ffd96a;font-weight:800;margin:4px 0 6px}
#lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 6px}
.lv{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid rgba(61,242,255,.4);background:rgba(30,50,110,.55);color:#e8f6ff;font-size:18px;font-weight:800;font-family:inherit;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.lv i{font-style:normal;font-size:9px;color:#ffd23f;letter-spacing:1px;height:11px}
.lv.cur{border-color:#ffd23f;box-shadow:0 0 12px rgba(255,210,63,.6)}
.lv.lock{opacity:.35;cursor:default}
.chap{display:flex;align-items:center;gap:10px;text-align:left;margin:10px 0 4px;padding:10px 12px;border-radius:14px;background:rgba(61,242,255,.08);border:1px solid rgba(61,242,255,.25)}
.chap b{font-size:16px}.chap span{font-size:11px;color:#9fb6d8;display:block}
.chap .dot{width:30px;height:30px;border-radius:50%;flex:none}
.chap.soon{opacity:.85;border-style:dashed;cursor:pointer}
.coin{color:#ffd96a;font-weight:800}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:20;padding:10px 18px;border-radius:14px;background:rgba(8,14,44,.92);border:1px solid var(--neon);color:#fff;font-size:15px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;box-shadow:0 0 18px rgba(61,242,255,.35)}
#toast.show{opacity:1}
#adTimer{font-size:44px;font-weight:900;color:#ffd23f;margin:10px 0}
</style>
</head>

var Core=(function(){
'use strict';
var DIRV={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
var SEATS={S:4,M:6,L:10};
// 关卡 JSON -> 运行对象
function parse(J){
  var L={id:J.id,cols:J.c,rows:J.r,docks:J.d,vip:J.v||0,tip:J.tip||'',ships:[],obs:[],queue:[]};
  J.s.forEach(function(a,i){L.ships.push({i:i,x:a[0],y:a[1],w:a[2],h:a[3],dir:a[4],color:a[5],seats:a[6]});});
  (J.o||[]).forEach(function(a){L.obs.push({x:a[0],y:a[1],w:a[2],h:a[3]});});
  J.q.forEach(function(r){for(var k=0;k<r[1];k++)L.queue.push(r[0]);});
  return L;
}
function occ(L,removed){
  var g=new Int16Array(L.cols*L.rows);g.fill(-1);
  L.obs.forEach(function(o,k){for(var y=o.y;y<o.y+o.h;y++)for(var x=o.x;x<o.x+o.w;x++)g[y*L.cols+x]=-2-k;});
  L.ships.forEach(function(s,i){if(removed[i])return;for(var y=s.y;y<s.y+s.h;y++)for(var x=s.x;x<s.x+s.w;x++)g[y*L.cols+x]=i;});
  return g;
}
// 机头方向到停机坪边缘的第一个阻挡物；-1 = 畅通
function blocker(L,s,g){
  var c=L.cols,x,y;
  if(s.dir==='U'){for(y=s.y-1;y>=0;y--)for(x=s.x;x<s.x+s.w;x++)if(g[y*c+x]!==-1)return g[y*c+x];}
  else if(s.dir==='D'){for(y=s.y+s.h;y<L.rows;y++)for(x=s.x;x<s.x+s.w;x++)if(g[y*c+x]!==-1)return g[y*c+x];}
  else if(s.dir==='L'){for(x=s.x-1;x>=0;x--)for(y=s.y;y<s.y+s.h;y++)if(g[y*c+x]!==-1)return g[y*c+x];}
  else {for(x=s.x+s.w;x<L.cols;x++)for(y=s.y;y<s.y+s.h;y++)if(g[y*c+x]!==-1)return g[y*c+x];}
  return -1;
}
function freeShips(L,removed){
  var g=occ(L,removed),out=[];
  for(var i=0;i<L.ships.length;i++)if(!removed[i]&&blocker(L,L.ships[i],g)===-1)out.push(i);
  return out;
}
function clearable(L){
  var rem=new Uint8Array(L.ships.length),left=L.ships.length;
  for(;;){var f=freeShips(L,rem);if(!f.length)break;f.forEach(function(i){rem[i]=1;});left-=f.length;}
  return left===0;
}
// 登舱结算：队首颜色依次登上「最早停靠」且同色有空位的飞船
function resolve(L,q,qi,docked){
  for(;;){
    if(qi>=q.length)return qi;
    var c=q[qi],hit=-1;
    for(var k=0;k<docked.length;k++){var d=docked[k];if(L.ships[d.id].color===c&&d.fill<L.ships[d.id].seats){hit=k;break;}}
    if(hit<0)return qi;
    docked[hit].fill++;qi++;
    if(docked[hit].fill>=L.ships[docked[hit].id].seats)docked.splice(hit,1);
  }
}
// 求解：state={removed,qi,docked:[{id,fill,vip}]} ；cap=普通登舱口数量 ；不使用牵引光束
function solve(L,cap,st,limit){
  var q=L.queue,n=L.ships.length;limit=limit||400000;
  var rem0=st?Uint8Array.from(st.removed):new Uint8Array(n);
  var dk0=st?st.docked.map(function(d){return {id:d.id,fill:d.fill,vip:!!d.vip};}):[];
  var qi0=resolve(L,q,st?st.qi:0,dk0);
  var seen=new Set(),nodes=0,path=[];
  function key(rem,qi,dk){var s='';for(var i=0;i<n;i++)s+=rem[i];s+='|'+qi+'|';for(var k=0;k<dk.length;k++)s+=dk[k].id+':'+dk[k].fill+(dk[k].vip?'v':'')+',';return s;}
  function dfs(rem,qi,dk){
    if(qi>=q.length)return true;
    if(++nodes>limit)return null;
    var k=key(rem,qi,dk);if(seen.has(k))return false;seen.add(k);
    var used=0;for(var j=0;j<dk.length;j++)if(!dk[j].vip)used++;
    if(used>=cap)return false;
    var fr=freeShips(L,rem);
    // 启发：队首颜色优先，其次在队列中越早出现越优先
    var firstPos={};for(var p=qi;p<q.length&&p<qi+120;p++)if(firstPos[q[p]]===undefined)firstPos[q[p]]=p-qi;
    fr.sort(function(a,b){var pa=firstPos[L.ships[a].color],pb=firstPos[L.ships[b].color];pa=pa===undefined?999:pa;pb=pb===undefined?999:pb;return pa-pb;});
    for(var t=0;t<fr.length;t++){
      var id=fr[t];var r2=Uint8Array.from(rem);r2[id]=1;
      var d2=dk.map(function(d){return {id:d.id,fill:d.fill,vip:d.vip};});d2.push({id:id,fill:0,vip:false});
      var q2=resolve(L,q,qi,d2);
      path.push(id);
      var res=dfs(r2,q2,d2);
      if(res)return true;if(res===null)return null;
      path.pop();
    }
    return false;
  }
  var r=dfs(rem0,qi0,dk0);
  return {ok:r===true,timeout:r===null,moves:r===true?path.slice():null,nodes:nodes};
}
// 模拟“普通玩家”（会看队首颜色但不做长远规划）的失败率，用于难度分级
function naiveFail(L,cap,rng,trials,smart){
  var q=L.queue,n=L.ships.length,fails=0;
  for(var t=0;t<trials;t++){
    var rem=new Uint8Array(n),dk=[],qi=0,ok=true;
    while(qi<q.length){
      var used=dk.length;if(used>=cap){ok=false;break;}
      var fr=freeShips(L,rem);if(!fr.length){ok=false;break;}
      var c=q[qi],has=dk.some(function(d){return L.ships[d.id].color===c;});
      var m=fr.filter(function(i){return L.ships[i].color===c;});
      var pick;
      if(!has&&m.length&&rng()<smart)pick=m[Math.floor(rng()*m.length)];
      else{var near={};for(var p=qi;p<q.length&&p<qi+12;p++)near[q[p]]=1;var m2=fr.filter(function(i){return near[L.ships[i].color];});
        pick=(m2.length&&rng()<smart)?m2[Math.floor(rng()*m2.length)]:fr[Math.floor(rng()*fr.length)];}
      rem[pick]=1;dk.push({id:pick,fill:0});qi=resolve(L,q,qi,dk);
    }
    if(!ok)fails++;
  }
  return fails/trials;
}
return {DIRV:DIRV,SEATS:SEATS,parse:parse,occ:occ,blocker:blocker,freeShips:freeShips,clearable:clearable,resolve:resolve,solve:solve,naiveFail:naiveFail};
})();

    btnVip:{x:ox+12,y:botY+6,w:Math.min(190,CW*0.5),h:botH-12},btnMute:{x:ox+CW-58,y:botY+8,w:44,h:botH-16}};
  buildQueuePath();layoutGrid();layoutDocks();G.bgDirty=true;
}
function layoutGrid(){
  if(!G.L)return;var h=LY.hang,L=G.L;
  var cell=Math.min((h.w-20)/L.cols,(h.h-30)/L.rows,58*LY.sc);
  LY.cell=cell;LY.gw=cell*L.cols;LY.gh=cell*L.rows;LY.gx=h.x+(h.w-LY.gw)/2;LY.gy=h.y+26+(h.h-30-LY.gh)/2;
}
function layoutDocks(){
  if(!G.L)return;var d=LY.dock,n=G.dockN+1,gap=6;
  var sw=(d.w-12-gap*(n-1))/n;LY.slots=[];
  for(var i=0;i<n;i++)LY.slots.push({x:d.x+6+i*(sw+gap),y:d.y+18,w:sw,h:d.h-22,vip:i===0});
  LY.shipLen=Math.min(d.h-40,64*LY.sc);LY.shipWid=Math.min(sw-14,26*LY.sc);
}
// 蛇形排队通道：0 号位在闸口
function buildQueuePath(){
  var h=LY.hall,nL=4,x0=h.x+22,x1=h.x+h.w-22,yTop=h.y+44,yBot=h.y+h.h-34;
  var gap=(yBot-yTop)/(nL-1),r=gap/2,pts=[],cx=h.x+h.w/2;
  function arc(cx_,cy_,a0,a1){for(var k=1;k<=10;k++){var a=a0+(a1-a0)*k/10;pts.push([cx_+Math.cos(a)*r,cy_+Math.sin(a)*r]);}}
  pts.push([x0+r,yTop]);
  for(var i=0;i<nL;i++){
    var y=yTop+i*gap,ltr=i%2===0;
    if(i===nL-1){pts.push([cx+(ltr?-0:0),y]);break;}
    pts.push([ltr?x1-r:x0+r,y]);
    if(ltr)arc(x1-r,y+r,-Math.PI/2,Math.PI/2);else arc(x0+r,y+r,-Math.PI/2,-Math.PI*1.5);
  }
  LY.gate={x:cx,y:h.y+h.h-12};
  pts.push([cx,LY.gate.y-10]);
  // 反向：从闸口往回量
  pts.reverse();var cum=[0];for(var j=1;j<pts.length;j++)cum.push(cum[j-1]+Math.hypot(pts[j][0]-pts[j-1][0],pts[j][1]-pts[j-1][1]));
  LY.qpts=pts;LY.qcum=cum;LY.qlen=cum[cum.length-1];LY.qsp=11*LY.sc;LY.qvis=Math.floor(LY.qlen/LY.qsp);
}
function qPos(s){var p=LY.qpts,c=LY.qcum;if(s<=0)return p[0];if(s>=LY.qlen)return p[p.length-1];
  var lo=0,hi=c.length-1;while(hi-lo>1){var m=(lo+hi)>>1;if(c[m]<s)lo=m;else hi=m;}
  var f=(s-c[lo])/(c[hi]-c[lo]||1);return [p[lo][0]+(p[hi][0]-p[lo][0])*f,p[lo][1]+(p[hi][1]-p[lo][1])*f];}

var ANG={U:0,R:Math.PI/2,D:Math.PI,L:-Math.PI/2};
function gridPose(s){var d=s.d,c=LY.cell,m=Math.max(2,c*0.08);var vert=d.dir==='U'||d.dir==='D';
  return {x:LY.gx+(d.x+d.w/2)*c,y:LY.gy+(d.y+d.h/2)*c,a:ANG[d.dir],len:(vert?d.h:d.w)*c-m*2,wid:(vert?d.w:d.h)*c-m*2};}

// 点击飞船
function tapShip(s){
  if(G.mode!=='play'||G.paused)return 'idle';
  G.lastAct=G.t;G.taps++;audio();
  if(G.vipArm){
    if(G.slotShip[0]){toast('VIP 登舱口占用中');G.vipArm=false;return 'vipbusy';}
    G.vipArm=false;G.vipUses--;G.usedVip++;assign(s,0,'beam');SFX.beam();return 'beam';
  }
  var g=Core.occ(G.L,removedArr());var b=Core.blocker(G.L,s.d,g);
  if(b!==-1){
    // 撞到阻挡物：向前顶一下再弹回
    var dv=Core.DIRV[s.d.dir],gapC=0,x,y;
    if(s.d.dir==='U'){y=s.d.y-1;while(y>=0&&g[y*G.L.cols+s.d.x]===-1&&(s.d.w<2||g[y*G.L.cols+s.d.x+1]===-1)){gapC++;y--;}}
    else if(s.d.dir==='D'){y=s.d.y+s.d.h;while(y<G.L.rows&&g[y*G.L.cols+s.d.x]===-1&&(s.d.w<2||g[y*G.L.cols+s.d.x+1]===-1)){gapC++;y++;}}
    else if(s.d.dir==='L'){x=s.d.x-1;while(x>=0&&g[s.d.y*G.L.cols+x]===-1&&(s.d.h<2||g[(s.d.y+1)*G.L.cols+x]===-1)){gapC++;x--;}}
    else {x=s.d.x+s.d.w;while(x<G.L.cols&&g[s.d.y*G.L.cols+x]===-1&&(s.d.h<2||g[(s.d.y+1)*G.L.cols+x]===-1)){gapC++;x++;}}
    s.bump=0.001;s.bumpD=gapC*LY.cell+LY.cell*0.22;G.bumps++;
    var tgt=b>=0?G.ships[b]:null;if(tgt){tgt.shake=0.35;}else{G.obsShake=G.obsShake||{};G.obsShake[-2-b]=0.35;}
    setTimeout(function(){SFX.bump();},Math.min(250,40+gapC*30));
    return 'bump';
  }
  var k=freeSlot();
  if(k<0){toast('登舱口已满！');G.dockShake=0.4;SFX.full();return 'full';}
  assign(s,k,'exit');SFX.tap();return 'go';
}
function assign(s,k,mode){
  s.slot=k;s.seq=++G.seq;s.vip=k===0;G.slotShip[k]=s;s.st=mode;s.t=0;s.arrived=false;G.ver++;
  s.v=mode==='exit'?260:0;s.sx=s.px;s.sy=s.py;s.sa=s.ang;s.sl=s.len;s.sw=s.wid;

function hangRect(){return {x:LY.gx,y:LY.gy,w:LY.gw,h:LY.gh};}
function updShips(dt){

      var dv=Core.DIRV[s.d.dir];s.v+=2600*dt;s.px+=dv[0]*s.v*dt;s.py+=dv[1]*s.v*dt;s.t+=dt;
      if(Math.random()<0.6)G.fx.push({x:s.px-dv[0]*s.len/2,y:s.py-dv[1]*s.len/2,vx:-dv[0]*60+(Math.random()-.5)*40,vy:-dv[1]*60+(Math.random()-.5)*40,life:0.35,max:0.35,c:'#9ff7ff',r:2.2});
      var out=s.px<hr.x-s.len*0.3||s.px>hr.x+hr.w+s.len*0.3||s.py<hr.y-s.len*0.3||s.py>hr.y+hr.h+s.len*0.3;
      if(out||s.t>1.2){s.st='fly';s.t=0;s.sx=s.px;s.sy=s.py;s.sa=s.ang;s.sl=s.len;s.sw=s.wid;
        var tp=slotPose(s.slot,s);s.cx=(s.sx+tp.x)/2+(s.sx<tp.x?-1:1)*30+dv[0]*80;s.cy=Math.min(s.sy,tp.y)+dv[1]*80-30;s.dur=0.32+Math.min(0.2,Math.hypot(tp.x-s.sx,tp.y-s.sy)/2400);}
    }

      s.t+=dt;var tp2=slotPose(s.slot,s),dur=s.st==='beam'?0.55:s.dur;var f=Math.min(1,s.t/dur),e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;

      if(s.fill>=s.d.seats&&s.launchAt&&G.t>=s.launchAt){s.st='launch';s.t=0;s.v=80;G.slotShip[s.slot]=null;G.ver++;SFX.launch();G.flash={x:s.px,y:s.py,t:0,c:PAL[s.d.color].c};
        for(var k2=0;k2<14;k2++)G.streaks.push({x:s.px+(Math.random()-.5)*s.wid*3,y:s.py-Math.random()*120,len:14+Math.random()*26,life:0.22+Math.random()*0.15,c:Math.random()<.5?PAL[s.d.color].c:"#ffffff"});}}
    else if(s.st==='launch'){s.t+=dt;s.v+=2200*dt;s.py-=s.v*dt;s.len*=1+dt*0.6;s.wid*=1-dt*0.4;

      if(s.py<-120){s.st='gone';G.ver++;}}
  });
}
// 登舱：队首旅客一个个上船
function updBoard(dt){
  if(G.qi>=G.q.length)return;
  G.boardT+=dt;var iv=Math.max(0.035,0.06-G.combo*0.0012);
  var guard=0;
  while(G.boardT>=iv&&guard++<4){
    var c=G.q[G.qi],list=dockedList(),hit=null;
    for(var k=0;k<list.length;k++)if(list[k].d.color===c){hit=list[k];break;}
    if(!hit||!hit.arrived){G.boardT=Math.min(G.boardT,iv);if(!hit)G.combo=0;break;}
    G.boardT-=iv;hit.fill++;G.qi++;G.combo++;G.ver++;
    var gp=LY.gate;G.fliers.push({x0:gp.x,y0:gp.y-6,s:hit,t:0,dur:0.2,c:c});
    SFX.board(hit.fill);G.boardingShip=hit;G.boardingT=0.25;
    if(hit.fill>=hit.d.seats){hit.launchAt=G.t+0.42;}
  }
}

  for(var i=G.fliers.length-1;i>=0;i--){var f=G.fliers[i];f.t+=dt;if(f.t>=f.dur){f.s.pop=1;if(Math.random()<.5)spark(f.s.px,f.s.py-f.s.len*0.3,PAL[f.c].c,3);G.fliers.splice(i,1);}}
}

function vipAvailable(){return !G.slotShip[0]&&(G.vipUses>0||save.coins>=30)&&G.L.vip>0;}
function checkEnd(dt){
  if(G.mode!=='play')return;
  if(G.qi>=G.q.length&&G.ships.every(function(s){return s.st==='gone';})){win();return;}
  if(busy()){G.stuckT=0;return;}
  var c=G.q[G.qi],can=dockedList().some(function(s){return s.d.color===c;});
  if(regularFull()&&!can){
    G.stuckT+=dt;
    if(vipAvailable()){if(!G.vipNag){G.vipNag=true;toast('登舱口满了！试试牵引光束');}return;}
    if(G.stuckT>0.6)lose();

}

  var prev=save.stars[G.lv]||0;save.stars[G.lv]=Math.max(prev,st);save.coins+=st*10;save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,G.lv+1));

function computeHint(){

function shipAt(x,y){
  if(!LY.cell)return null;var cx=Math.floor((x-LY.gx)/LY.cell),cy=Math.floor((y-LY.gy)/LY.cell);

  return null;
}

  for(var i=0;i<G.L.obs.length;i++){var o=G.L.obs[i];if(cx>=o.x&&cx<o.x+o.w&&cy>=o.y&&cy<o.y+o.h)return i;}return -1;}

  for(var i=0;i<STARS.length;i+=4){var s=STARS[i],a=0.5+0.5*Math.sin(G.t*s.s+s.p);ctx.fillStyle='rgba(200,240,255,'+(a*0.8)+')';ctx.fillRect(h.x+s.x*h.w-0.8,h.y+s.y*h.h-0.8,1.6,1.6);}
  // 扫描光带
  var sy=h.y+((G.t*40)%(h.h+60))-30;var sg=ctx.createLinearGradient(0,sy-20,0,sy+20);sg.addColorStop(0,'rgba(61,242,255,0)');sg.addColorStop(0.5,hexA(T.neon,0.05));sg.addColorStop(1,'rgba(61,242,255,0)');ctx.fillStyle=sg;ctx.fillRect(h.x,sy-20,h.w,40);
  // 排队旅客
  G.qShow+=(G.qi-G.qShow)*Math.min(1,S.dt*14);
  var sp=LY.qsp,r=sp*0.5,n=Math.min(G.q.length,G.qi+LY.qvis+2);
  for(var j=n-1;j>=G.qi;j--){var sv=(j-G.qShow)*sp;if(sv>LY.qlen)continue;var p=S.qPos(sv);var bob=Math.sin(G.t*6+j*0.7)*0.8;drawPassenger(p[0],p[1],r,G.q[j],bob);}
  ctx.restore();
  var rest=G.q.length-G.qi-LY.qvis;if(rest>0){var p0=S.qPos(LY.qlen);bubble(p0[0]+4,p0[1]-12,'+'+rest,T.neon);}
  // 闸口传送环
  var gp=LY.gate;var fc=G.qi<G.q.length?PAL[G.q[G.qi]]:null;
  ctx.save();ctx.translate(gp.x,gp.y);var pr=10+Math.sin(G.t*4)*1.5;ctx.strokeStyle=fc?fc.c:T.neon;ctx.lineWidth=2.5;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.ellipse(0,0,pr*1.6,pr*0.55,0,0,6.283);ctx.stroke();ctx.restore();
  // 待登舱计数
  ctx.fillStyle='rgba(4,10,30,0.8)';rr(ctx,h.x+h.w-86,h.y+h.h-24,78,18,9);ctx.fill();
  ctx.fillStyle='#bfefff';ctx.font='700 '+Math.round(11*LY.sc)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('待登舱 '+(G.q.length-G.qi),h.x+h.w-47,h.y+h.h-15);
  // 登舱口
  drawDocks(LY,T);
  // 停机坪：货运舱 + 飞船
  if(G.obsShake)for(var ok in G.obsShake)G.obsShake[ok]=Math.max(0,G.obsShake[ok]-S.dt);
  G.L.obs.forEach(drawObs);
  var hint=null;
  if(G.mode==='play'&&!G.paused&&!G.vipArm&&(G.lv<=2||S.G.t-G.lastAct>10)&&!S.busy()){var hid=S.computeHint();if(hid!=null&&G.ships[hid].st==='grid')hint=G.ships[hid];}
  G.ships.forEach(function(s){if(s.st==='grid')drawShip(s);});
  if(G.vipArm){ctx.save();ctx.strokeStyle=T.neon2;ctx.lineWidth=3;ctx.shadowColor=T.neon2;ctx.shadowBlur=16;ctx.globalAlpha=0.6+0.4*Math.sin(G.t*8);ctx.strokeRect(LY.gx-6,LY.gy-6,LY.gw+12,LY.gh+12);ctx.restore();}
  G.ships.forEach(function(s){if(s.st==='dock')drawShip(s);});
  // 光桥
  if(G.boardingShip&&G.boardingT>0){G.boardingT-=S.dt;var bs=G.boardingShip;ctx.save();ctx.globalAlpha=Math.min(1,G.boardingT*5);var lg=ctx.createLinearGradient(gp.x,gp.y,bs.px,bs.py);lg.addColorStop(0,hexA(PAL[bs.d.color].c,0.1));lg.addColorStop(1,hexA(PAL[bs.d.color].c,0.6));ctx.strokeStyle=lg;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(gp.x,gp.y);ctx.lineTo(bs.px,bs.py-bs.len*0.2);ctx.stroke();ctx.restore();}
  G.ships.forEach(function(s){if(s.st==='exit'||s.st==='fly')drawShip(s,1,1.08);
    if(s.st==='beam'){ctx.save();ctx.strokeStyle=hexA(T.neon2,0.5);ctx.lineWidth=s.wid*0.9;ctx.lineCap='round';var sl=LY.slots[0];ctx.beginPath();ctx.moveTo(sl.x+sl.w/2,sl.y+sl.h/2);ctx.lineTo(s.px,s.py);ctx.stroke();ctx.restore();drawShip(s,1,1.05);}
    if(s.st==='launch')drawShip(s,Math.max(0,1-s.t*1.2));});
  // 曲速光带
  for(var k=G.streaks.length-1;k>=0;k--){var st=G.streaks[k];st.life-=S.dt;st.y-=900*S.dt;if(st.life<=0){G.streaks.splice(k,1);continue;}ctx.strokeStyle=st.c;ctx.globalAlpha=Math.min(1,st.life*4);ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(st.x,st.y);ctx.lineTo(st.x,st.y+st.len);ctx.stroke();ctx.globalAlpha=1;}
  if(G.flash){G.flash.t+=S.dt;var fr=G.flash.t*260;ctx.strokeStyle=hexA(G.flash.c,Math.max(0,1-G.flash.t*2.5));ctx.lineWidth=4;ctx.beginPath();ctx.arc(G.flash.x,G.flash.y,fr,0,6.283);ctx.stroke();if(G.flash.t>0.4)G.flash=null;}
  // 登舱旅客飞行
  G.fliers.forEach(function(f){var e=f.t/f.dur;var tx=f.s.px,ty=f.s.py-f.s.len*0.15;var x=f.x0+(tx-f.x0)*e,y=f.y0+(ty-f.y0)*e-Math.sin(e*Math.PI)*28;drawPassenger(x,y,LY.qsp*0.5*(1-e*0.4),f.c,0);});
  // 粒子
  for(var q=G.fx.length-1;q>=0;q--){var fx=G.fx[q];fx.life-=S.dt;if(fx.life<=0){G.fx.splice(q,1);continue;}fx.x+=fx.vx*S.dt;fx.y+=fx.vy*S.dt;fx.vx*=0.96;fx.vy*=0.96;ctx.globalAlpha=fx.life/fx.max;ctx.fillStyle=fx.c;ctx.fillRect(fx.x-fx.r/2,fx.y-fx.r/2,fx.r,fx.r);}ctx.globalAlpha=1;
  for(var w=G.rip.length-1;w>=0;w--){var rp=G.rip[w];rp.t+=S.dt;if(rp.t>0.4){G.rip.splice(w,1);continue;}ctx.strokeStyle=rp.c;ctx.globalAlpha=1-rp.t/0.4;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(rp.x,rp.y,8+rp.t*90,0,6.283);ctx.stroke();ctx.globalAlpha=1;}
  // 新手手势
  if(hint){var hx=hint.px,hy=hint.py+Math.sin(G.t*6)*5;ctx.save();ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.5*Math.sin(G.t*6))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(hint.px,hint.py,Math.max(hint.len,hint.wid)*0.55,0,6.283);ctx.stroke();ctx.font=Math.round(34*LY.sc)+'px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('👆',hx-6,hy+2);ctx.restore();}
  drawHud(LY,T);
}
function bubble(x,y,t,col){var LY=S.LY();ctx.font='800 '+Math.round(11*LY.sc)+'px sans-serif';var w=ctx.measureText(t).width+12;ctx.fillStyle='rgba(4,10,30,0.85)';rr(ctx,x-w/2,y-9,w,18,9);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1;rr(ctx,x-w/2,y-9,w,18,9);ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y+0.5);}
function drawDocks(LY,T){
  var sh=G.dockShake>0?Math.sin(G.dockShake*60)*G.dockShake*10:0;if(G.dockShake>0)G.dockShake-=S.dt;
  LY.slots.forEach(function(sl,k){
    var x=sl.x+sh,col=sl.vip?T.neon2:T.neon,occ=G.slotShip[k];
    ctx.save();ctx.fillStyle=sl.vip?'rgba(178,107,255,0.10)':'rgba(61,242,255,0.06)';rr(ctx,x,sl.y,sl.w,sl.h,10);ctx.fill();
    ctx.setLineDash(occ?[]:[5,4]);ctx.strokeStyle=hexA(col,occ?0.9:0.5);ctx.lineWidth=occ?2:1.4;if(occ){ctx.shadowColor=col;ctx.shadowBlur=10;}rr(ctx,x+1,sl.y+1,sl.w-2,sl.h-2,10);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    // 停泊光圈
    ctx.strokeStyle=hexA(col,0.22);ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x+sl.w/2,sl.y+sl.h/2-6,sl.w*0.36,sl.h*0.36,0,0,6.283);ctx.stroke();
    if(sl.vip){ctx.fillStyle=hexA(T.neon2,occ?0.4:0.85);ctx.font='900 '+Math.round(11*LY.sc)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('VIP',x+sl.w/2,sl.y+sl.h-10);}
    if(occ&&occ.st!=='launch'){var full=occ.fill>=occ.d.seats;ctx.fillStyle=full?'#7dffb0':'#fff';ctx.font='800 '+Math.round(11*LY.sc)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(occ.fill+'/'+occ.d.seats,x+sl.w/2,sl.y+sl.h-9);}
  });
}
function drawHud(LY,T){
  var t=LY.top,bh=LY.barH;
  iconBtn(LY.btnMenu,'☰',T);iconBtn(LY.btnRestart,'↻',T);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='900 '+Math.round(19*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';ctx.save();ctx.shadowColor=T.neon;ctx.shadowBlur=10;ctx.fillText('第 '+G.lv+' 关',LY.ox+LY.CW/2,t+bh/2-6);ctx.restore();
  ctx.font='600 '+Math.round(10*LY.sc)+'px sans-serif';ctx.fillStyle=hexA(T.neon,0.85);ctx.fillText(T.name+' · ★'+(S.save().stars[G.lv]||0)+'  ◎ '+S.save().coins,LY.ox+LY.CW/2,t+bh/2+11);
  // 牵引光束按钮
  var b=LY.btnVip,on=G.L.vip>0,arm=G.vipArm,pulse=G.vipNag?0.5+0.5*Math.sin(G.t*10):0;
  ctx.save();ctx.globalAlpha=on?1:0.45;var g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);g.addColorStop(0,arm?'#d9a6ff':'#7b4dd6');g.addColorStop(1,arm?'#9b5cff':'#3e2482');ctx.fillStyle=g;rr(ctx,b.x,b.y,b.w,b.h,14);ctx.fill();
  ctx.strokeStyle=hexA(T.neon2,0.6+pulse*0.4);ctx.lineWidth=2+pulse*3;ctx.shadowColor=T.neon2;ctx.shadowBlur=8+pulse*16;rr(ctx,b.x,b.y,b.w,b.h,14);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='800 '+Math.round(14*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';ctx.textAlign='left';ctx.fillText(arm?'✦ 点选飞船…':'✦ 牵引光束',b.x+12,b.y+b.h/2);
  var badge=on?(G.vipUses>0?'×'+G.vipUses:'30◎'):'🔒';ctx.textAlign='right';ctx.fillStyle='#ffe27a';ctx.fillText(badge,b.x+b.w-12,b.y+b.h/2);ctx.restore();
  // 提示文字
  var tip=G.L.tip;if(tip&&G.taps<3&&G.mode==='play'&&G.banner<=0){ctx.font='700 '+Math.round(12*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';var tw=LY.hang.w-36,lines=wrap(tip,tw-20).slice(0,2),th=lines.length*16+12,ty=LY.hall.y+30;
    ctx.fillStyle='rgba(4,10,30,0.88)';rr(ctx,LY.ox+LY.CW/2-tw/2,ty,tw,th,10);ctx.fill();ctx.strokeStyle=hexA(T.neon,0.6);ctx.lineWidth=1;rr(ctx,LY.ox+LY.CW/2-tw/2,ty,tw,th,10);ctx.stroke();
    ctx.fillStyle='#d8f6ff';ctx.textAlign='center';lines.forEach(function(l,i){ctx.fillText(l,LY.ox+LY.CW/2,ty+14+i*16);});}
  iconBtn(LY.btnMute,S.save().mute?'🔇':'🔊',T);
  // 关卡横幅
  if(G.banner>0){G.banner-=S.dt;var a=Math.min(1,G.banner*2);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(4,10,30,0.75)';var bw2=230*LY.sc,y=LY.hang.y+LY.hang.h*0.42;rr(ctx,LY.ox+LY.CW/2-bw2/2,y-30,bw2,60,16);ctx.fill();ctx.strokeStyle=T.neon;ctx.lineWidth=1.5;rr(ctx,LY.ox+LY.CW/2-bw2/2,y-30,bw2,60,16);ctx.stroke();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 '+Math.round(22*LY.sc)+'px -apple-system,"PingFang SC",sans-serif';ctx.fillText('第 '+G.lv+' 关',LY.ox+LY.CW/2,y-6);ctx.font='600 '+Math.round(11*LY.sc)+'px sans-serif';ctx.fillStyle=T.neon;ctx.fillText(G.q.length+' 位旅客抵达 · '+G.L.ships.length+' 艘飞船待命',LY.ox+LY.CW/2,y+15);ctx.restore();}
}
function wrap(t,maxW){var out=[],cur='';for(var i=0;i<t.length;i++){var c2=cur+t[i];if(ctx.measureText(c2).width>maxW&&cur){out.push(cur);cur=t[i];}else cur=c2;}if(cur)out.push(cur);return out;}
function iconBtn(r,ch,T){ctx.fillStyle='rgba(10,18,50,0.85)';rr(ctx,r.x,r.y+2,r.w,r.h-4,12);ctx.fill();ctx.strokeStyle=hexA(T.neon,0.5);ctx.lineWidth=1;rr(ctx,r.x,r.y+2,r.w,r.h-4,12);ctx.stroke();ctx.fillStyle='#e8f6ff';ctx.font='700 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,r.x+r.w/2,r.y+r.h/2+1);}

// ---------- 界面 ----------
function $(id){return document.getElementById(id);}
window.hideAll=function(){['menu','win','lose','ad'].forEach(function(i){$(i).classList.add('hidden');});G.paused=false;};
window.openMenu=function(){
  G.paused=true;var sv=S.save(),T=S.theme();$('mCoins').textContent=sv.coins;var gr=$('lvGrid');gr.innerHTML='';
  $('chap1dot').style.background='radial-gradient(circle at 35% 35%,#ff7ad9,#8a6bff 55%,#2a1a66)';$('chap2dot').style.background='radial-gradient(circle at 35% 35%,#9fd8ff,#3b7bff 55%,#0b1f55)';
  S.LEVELS.forEach(function(_,i){var n=i+1,b=document.createElement('button');b.className='lv'+(n>sv.unlocked?' lock':'')+(n===G.lv?' cur':'');var st=sv.stars[n]||0;
    b.innerHTML=(n>sv.unlocked?'🔒':n)+'<i>'+(st?'★★★'.slice(0,st):'')+'</i>';b.dataset.lv=n;
    b.onclick=function(){if(n>sv.unlocked)return;S.loadLevel(n);};gr.appendChild(b);});
  $('chap1name').textContent=THEMES.ring.name+(G.themeId==='ring'?' · 当前':'');
  $('menu').classList.remove('hidden');
};
$('mClose').onclick=function(){hideAll();};
$('chap2').onclick=function(){G.themeId=G.themeId==='moon'?'ring':'moon';G.bgDirty=true;hideAll();S.loadLevel(G.lv);
  document.documentElement.style.setProperty('--neon',S.theme().neon);document.documentElement.style.setProperty('--neon2',S.theme().neon2);
  setTimeout(function(){var t=document.getElementById('toast');t.textContent=G.themeId==='moon'?'月球港外观预览（再点一次切回）':'回到星环空间站';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1600);},50);};
window.showWin=function(){document.getElementById('toast').classList.remove('show');
  var sv=S.save();$('wReward').textContent='+'+G.starsGot*10+' 星币';
  $('wSub').textContent=G.lv>=S.LEVELS.length?'第一站全部完成！月球港即将开放':'飞船已全部升空 · 撞车 '+G.bumps+' 次'+(G.revived?' · 用了增援登舱口':'');
  $('wNext').textContent=G.lv>=S.LEVELS.length?'回到关卡列表':'下一关';
  var sp=$('wStars').children;for(var i=0;i<3;i++)sp[i].className='';
  $('win').classList.remove('hidden');
  for(var j=0;j<G.starsGot;j++)(function(j){setTimeout(function(){sp[j].className='on';S.SFX.board(8+j*6);},250+j*260);})(j);
};
$('wNext').onclick=function(){if(G.lv>=S.LEVELS.length){openMenu();return;}S.loadLevel(G.lv+1);};
$('wMenu').onclick=function(){openMenu();};
window.showLose=function(){document.getElementById('toast').classList.remove('show');$('lAd').classList.toggle('hidden',G.revived);$('lSub').textContent=G.revived?'增援登舱口也满了，换个调度顺序再试一次':'停靠的飞船都等不到同色旅客了';$('lose').classList.remove('hidden');};
$('lRetry').onclick=function(){S.loadLevel(G.lv);};
$('lAd').onclick=function(){$('lose').classList.add('hidden');$('ad').classList.remove('hidden');var n=3;$('adTimer').textContent=n;
  var iv=setInterval(function(){n--;$('adTimer').textContent=n;if(n<=0){clearInterval(iv);S.revive();}},G.fastAd?60:800);};

// ---------- 主循环 ----------
var last=performance.now();S.dt=0;S.frames=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;S.dt=dt;S.frames++;
  if(!G.paused){G.t+=dt;S.updShips(dt);S.updBoard(dt);S.updFliers(dt);S.checkEnd(dt);}else{S.dt=0;}
  render();requestAnimationFrame(frame);
}
S.layout();S.loadLevel(S.save().cur||1);
document.documentElement.style.setProperty('--neon',S.theme().neon);document.documentElement.style.setProperty('--neon2',S.theme().neon2);
requestAnimationFrame(frame);
})();

</script>
